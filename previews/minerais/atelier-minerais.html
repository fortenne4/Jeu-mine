const RARETES = {
  "Commun":      {couleur: "#b9b2a8"},
  "Peu commun":  {couleur: "#6fd16f"},
  "Rare":        {couleur: "#5aa8ff"},
  "Épique":      {couleur: "#b77cff"},
  "Légendaire":  {couleur: "#f2c14e"},
  "Mythique":    {couleur: "#ff5a6a"},
};
const ORDRE_RARETE = Object.keys(RARETES);

// =====================================================================================
// Hasard reproductible (le jeu utilise Random de Roblox : même recette, autre tirage)
// =====================================================================================
function rngDe(graine) {
  let a = graine >>> 0;
  const suivant = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return { n: (min, max) => min + (max - min) * suivant() };
}

// =====================================================================================
// Petit équivalent des CFrame Roblox (mêmes conventions : Y vers le haut, lookAt regarde vers −Z)
// =====================================================================================
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const CF = {
  T: (x, y, z) => new THREE.Matrix4().makeTranslation(x, y, z),
  Tv: (v) => new THREE.Matrix4().makeTranslation(v.x, v.y, v.z),
  A: (x, y, z) => new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(x, y, z, "XYZ")),
  lookAt: (pos, cible) => {
    const m = new THREE.Matrix4().lookAt(pos, cible, V(0, 1, 0));
    m.setPosition(pos);
    return m;
  },
  mul: (...ms) => ms.reduce((acc, m) => acc.multiply(m), new THREE.Matrix4()),
  pos: (m) => new THREE.Vector3().setFromMatrixPosition(m),
};

// =====================================================================================
// Matériaux Roblox → matériaux three.js (approximation visuelle)
// =====================================================================================
const lin = (rgb) => new THREE.Color(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255).convertSRGBToLinear();
const cacheMat = new Map();
function materiau(nom, rgb, reflet, transparent) {
  const cle = nom + rgb.join(",") + reflet + transparent;
  if (cacheMat.has(cle)) return cacheMat.get(cle);
  let m;
  if (nom === "Neon") {
    m = new THREE.MeshBasicMaterial({ color: lin(rgb).multiplyScalar(2.2), toneMapped: false });
  } else {
    const p = {
      Slate: [0.85, 0], Granite: [0.8, 0], Basalt: [0.92, 0], Sandstone: [0.95, 0], Marble: [0.35, 0],
      CrackedLava: [0.85, 0], Ice: [0.12, 0], Metal: [0.32, 0.85], Foil: [0.2, 1], Glass: [0.04, 0],
    }[nom] || [0.6, 0];
    m = new THREE.MeshStandardMaterial({ color: lin(rgb), roughness: p[0], metalness: p[1], envMapIntensity: 0.3 + reflet * 1.6 });
    if (nom === "CrackedLava") { m.emissive = lin([255, 80, 10]); m.emissiveIntensity = 0.12; }
    if (nom === "Ice") { m.transparent = true; m.opacity = 0.92; }
    if (transparent) { m.transparent = true; m.opacity = 0.85; m.envMapIntensity = 1.2; }
  }
  cacheMat.set(cle, m);
  return m;
}

// =====================================================================================
// Construction : portage ligne à ligne de MineraisModeles.construire
// =====================================================================================
const boite = new THREE.BoxGeometry(1, 1, 1);
function construire(def, sol, graine, sansCailloux) {
  const r = rngDe(graine);
  const s = def.taille;
  const groupe = new THREE.Group();

  const piece = (taille, cf, rgb, mat, decor) => {
    const transparent = decor && mat === "Glass";
    const m = new THREE.Mesh(boite, materiau(mat, rgb, decor && mat === "Glass" ? 0.35 : def.reflet, transparent));
    m.matrixAutoUpdate = false;
    m.matrix.copy(cf).multiply(new THREE.Matrix4().makeScale(taille.x, taille.y, taille.z));
    m.castShadow = !transparent && mat !== "Neon";
    m.receiveShadow = true;
    groupe.add(m);
    return m;
  };

  const centre = CF.mul(sol.clone(), CF.T(0, 1.25 * s, 0), CF.A(0, r.n(0, Math.PI * 2), 0));
  const cPos = CF.pos(centre);
  piece(V(2.3, 2, 2.2).multiplyScalar(s), CF.mul(centre.clone(), CF.A(r.n(-0.2, 0.2), 0, r.n(-0.2, 0.2))), def.couleur, def.materiau);

  const facettes = (c, rayon, nombre, echelle) => {
    for (let i = 1; i <= nombre; i++) {
      const dir = V(r.n(-1, 1), r.n(-0.5, 1), r.n(-1, 1)).normalize();
      const t = V(r.n(1, 1.6), r.n(0.8, 1.4), r.n(1, 1.6)).multiplyScalar(s * echelle);
      const cf = CF.mul(CF.Tv(c.clone().addScaledVector(dir, rayon)), CF.A(r.n(0, 6.28), r.n(0, 6.28), r.n(0, 6.28)));
      piece(t, cf, i % 2 === 0 ? def.couleur : def.couleur2, def.materiau);
    }
  };
  facettes(cPos, 0.8 * s, 14, 1);
  for (const d of [V(1.3, -0.5, 0.6), V(-1.2, -0.6, -0.5), V(0.2, -0.8, -1.2)]) {
    facettes(CF.pos(CF.mul(centre.clone(), CF.Tv(d.clone().multiplyScalar(s)))), 0.35 * s, 5, 0.5);
  }

  for (let k = 0; k < def.cristaux; k++) {
    const dir = V(r.n(-1, 1), r.n(-0.1, 1), r.n(-1, 1)).normalize();
    const pos = cPos.clone().addScaledVector(dir, 1.2 * s);
    const h = r.n(0.5, 0.95) * s;
    const cf = CF.mul(CF.lookAt(pos, pos.clone().add(dir)), CF.A(-Math.PI / 2, 0, 0), CF.A(0, Math.PI / 4, 0));
    piece(V(0.28 * s, h, 0.28 * s), cf, def.cristal, def.cristalMat, true);
  }

  for (let a = 1; a <= def.amas; a++) {
    const angle = a * 2.4 + r.n(0, 1);
    const dir = V(Math.cos(angle), r.n(0.25, 0.9), Math.sin(angle)).normalize();
    const base = cPos.clone().addScaledVector(dir, 1.0 * s);
    for (let k = 0; k < 3; k++) {
      const d2 = dir.clone().add(V(r.n(-0.4, 0.4), r.n(-0.2, 0.2), r.n(-0.4, 0.4))).normalize();
      const pos = base.clone().add(V(r.n(-0.2, 0.2), r.n(-0.2, 0.2), r.n(-0.2, 0.2)).multiplyScalar(s));
      const h = r.n(0.6, 1.2) * s;
      const rc = r.n(0.22, 0.34) * s;
      const axe = CF.mul(CF.lookAt(pos, pos.clone().add(d2)), CF.A(-Math.PI / 2, 0, 0));
      piece(V(rc, h, rc), CF.mul(axe.clone(), CF.T(0, h / 2, 0), CF.A(0, Math.PI / 4, 0)), def.cristal, def.cristalMat, true);
      piece(V(1, 1, 1).multiplyScalar(rc * 0.72), CF.mul(axe.clone(), CF.T(0, h, 0), CF.A(Math.PI / 4, 0, Math.PI / 4)), def.cristal, def.cristalMat, true);
    }
  }

  for (let k = 0; k < def.veines; k++) {
    const dir = V(r.n(-1, 1), r.n(-0.6, 1), r.n(-1, 1)).normalize();
    const pos = cPos.clone().addScaledVector(dir, 1.12 * s);
    const tangente = dir.clone().cross(V(r.n(-1, 1), r.n(-1, 1), r.n(-1, 1))).normalize();
    piece(V(0.09, 0.09, r.n(0.8, 1.6) * s), CF.lookAt(pos, pos.clone().add(tangente)), def.veine, "Neon", true);
  }

  if (!sansCailloux) {
    for (let k = 0; k < 6; k++) {
      const a = r.n(0, Math.PI * 2);
      const rr = r.n(1.8, 2.8) * s;
      const t = r.n(0.25, 0.55) * s;
      const cf = CF.mul(sol.clone(), CF.T(Math.cos(a) * rr, t * 0.3, Math.sin(a) * rr), CF.A(r.n(0, 6), r.n(0, 6), r.n(0, 6)));
      piece(V(t, t * 0.7, t * 1.2), cf, def.couleur2, def.materiau, true);
    }
  }
  if (def.speciaux) ajouterSpeciaux(def, groupe, r, cPos, piece);
  return groupe;
}

// =====================================================================================
// Effets spéciaux (Épique et au-dessus) — PAS encore dans MineraisModeles.lua : idées à porter en Luau
// (cristal géant = Parts, éclats/anneau = Parts animées par TweenService ou RenderStepped, lueur = PointLight,
//  étincelles = ParticleEmitter)
// =====================================================================================
let animations = [];
function bloc(taille, rgb, mat, transparent) {
  const m = new THREE.Mesh(boite, materiau(mat, rgb, 0.35, transparent));
  m.scale.copy(taille);
  m.castShadow = !transparent && mat !== "Neon";
  return m;
}
function ajouterSpeciaux(def, groupe, r, cPos, piece) {
  const sp = def.speciaux, s = def.taille;
  const verre = def.cristalMat === "Glass";

  // Cristal géant (ou bouquet de géants) planté au sommet, avec un cœur lumineux à l'intérieur
  for (let i = 0; i < (sp.geant || 0); i++) {
    const principal = i === 0;
    const dir = V(r.n(-0.35, 0.35), 1, r.n(-0.35, 0.35)).normalize();
    if (!principal) dir.add(V(r.n(-0.6, 0.6), 0, r.n(-0.6, 0.6))).normalize();
    const pos = cPos.clone().add(V(r.n(-0.3, 0.3) * s, 0.55 * s, r.n(-0.3, 0.3) * s));
    const h = r.n(1.9, 2.5) * s * (principal ? 1 : 0.7);
    const w = 0.62 * s * (principal ? 1 : 0.75);
    const axe = CF.mul(CF.lookAt(pos, pos.clone().add(dir)), CF.A(-Math.PI / 2, 0, 0));
    piece(V(w, h, w), CF.mul(axe.clone(), CF.T(0, h / 2, 0), CF.A(0, Math.PI / 4, 0)), def.cristal, def.cristalMat, true);
    piece(V(1, 1, 1).multiplyScalar(w * 0.72), CF.mul(axe.clone(), CF.T(0, h, 0), CF.A(Math.PI / 4, 0, Math.PI / 4)), def.cristal, def.cristalMat, true);
    if (verre) piece(V(w * 0.32, h * 0.8, w * 0.32), CF.mul(axe.clone(), CF.T(0, h * 0.45, 0), CF.A(0, Math.PI / 4, 0)), def.veine, "Neon", true);
    // collerette de petits cristaux à la base
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * Math.PI * 2 + r.n(0, 0.6);
      const d2 = V(Math.cos(a), 0.9, Math.sin(a)).normalize();
      const hh = r.n(0.45, 0.8) * s, ww = w * 0.38;
      const ax2 = CF.mul(CF.lookAt(pos, pos.clone().add(d2)), CF.A(-Math.PI / 2, 0, 0));
      piece(V(ww, hh, ww), CF.mul(ax2.clone(), CF.T(0, hh / 2, 0), CF.A(0, Math.PI / 4, 0)), def.cristal, def.cristalMat, true);
    }
  }

  // Lueur : PointLight de la couleur des cristaux, qui respire
  if (sp.lueur) {
    const l = new THREE.PointLight(lin(def.cristal), sp.lueur, 10 * s, 2);
    l.position.copy(cPos).add(V(0, 1.6 * s, 0));
    groupe.add(l);
    const ph = r.n(0, 6);
    animations.push((t) => { l.intensity = sp.lueur * (0.75 + 0.25 * Math.sin(t * 2.2 + ph)); });
  }

  // Néons qui pulsent (veines + cristaux néon) : matériaux propres à ce minerai
  if (sp.pulse) {
    const neons = new Set();
    groupe.traverse((o) => { if (o.isMesh && o.material.isMeshBasicMaterial) neons.add(o); });
    const mats = [];
    for (const o of neons) { o.material = o.material.clone(); mats.push([o.material, o.material.color.clone()]); }
    const ph = r.n(0, 6);
    animations.push((t) => {
      const k = 0.55 + 0.45 * Math.pow(0.5 + 0.5 * Math.sin(t * 2.6 + ph), 2);
      for (const [m, base] of mats) m.color.copy(base).multiplyScalar(0.4 + k);
    });
  }

  // Éclats en lévitation qui tournent autour du rocher
  if (sp.eclats) {
    const pivot = new THREE.Group();
    pivot.position.copy(cPos);
    groupe.add(pivot);
    const eclats = [];
    for (let i = 0; i < sp.eclats; i++) {
      const a = i / sp.eclats * Math.PI * 2;
      const e = new THREE.Group();
      const corps = bloc(V(0.26, 0.62, 0.26).multiplyScalar(s), def.cristal, def.cristalMat, verre);
      corps.rotation.y = Math.PI / 4;
      e.add(corps);
      if (verre) e.add(bloc(V(0.1, 0.5, 0.1).multiplyScalar(s), def.veine, "Neon", true));
      e.position.set(Math.cos(a) * 2.35 * s, r.n(0.3, 1.5) * s, Math.sin(a) * 2.35 * s);
      e.rotation.set(r.n(-0.5, 0.5), 0, r.n(-0.5, 0.5));
      pivot.add(e);
      eclats.push({ e, y: e.position.y, ph: r.n(0, 6) });
    }
    animations.push((t, dt) => {
      pivot.rotation.y += dt * 0.45;
      for (const { e, y, ph } of eclats) { e.position.y = y + Math.sin(t * 1.6 + ph) * 0.18 * s; e.rotation.y += dt * 1.4; }
    });
  }

  // Anneau de runes (Mythique) : couronne inclinée qui tourne en sens inverse
  if (sp.anneau) {
    const anneau = new THREE.Group();
    anneau.position.copy(cPos).add(V(0, 0.4 * s, 0));
    anneau.rotation.set(0.28, 0, 0.12);
    groupe.add(anneau);
    for (let i = 0; i < sp.anneau; i++) {
      const a = i / sp.anneau * Math.PI * 2;
      const pair = i % 2 === 0;
      const b = bloc(V(1, 1, 1).multiplyScalar((pair ? 0.3 : 0.18) * s), pair ? def.veine : def.cristal, "Neon", true);
      b.position.set(Math.cos(a) * 2.9 * s, 0, Math.sin(a) * 2.9 * s);
      b.rotation.set(Math.PI / 4, -a, Math.PI / 4);
      anneau.add(b);
    }
    animations.push((t, dt) => { anneau.rotation.y -= dt * 0.7; });
  }

  // Petite lune en lévitation (Lunarite)
  if (sp.lune) {
    const lune = new THREE.Group();
    for (let k = 0; k < 3; k++) {
      const b = new THREE.Mesh(boite, new THREE.MeshStandardMaterial({ color: lin(def.couleur), roughness: 0.4,
        emissive: lin(def.cristal), emissiveIntensity: 0.9 }));
      b.scale.setScalar(0.85 * s);
      b.rotation.set(k * 0.7, k * 0.9, k * 0.4);
      lune.add(b);
    }
    const y0 = cPos.y + 3.1 * s;
    lune.position.set(cPos.x, y0, cPos.z);
    groupe.add(lune);
    animations.push((t, dt) => { lune.position.y = y0 + Math.sin(t * 1.1) * 0.25 * s; lune.rotation.y += dt * 0.5; lune.rotation.x += dt * 0.2; });
  }

  // Étincelles : scintille (fixes qui clignotent), monte, braises (montent en ondulant), aspire (vers le cœur)
  if (sp.etincelles) {
    const { n, mode } = sp.etincelles;
    const couleur = mode === "braises" ? [255, 150, 40] : def.veine;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const m = bloc(V(1, 1, 1), couleur, "Neon", true);
      m.rotation.set(Math.PI / 4, 0, Math.PI / 4);
      groupe.add(m);
      const a = r.n(0, Math.PI * 2), rr = r.n(1.4, 2.8) * s;
      parts.push({ m, a, rr, y: r.n(-0.6, 2.2) * s, ph: r.n(0, 1), vit: r.n(0.5, 1.2), taille: r.n(0.07, 0.14) * s });
    }
    animations.push((t) => {
      for (const p of parts) {
        if (mode === "scintille") {
          const k = Math.pow(Math.max(0, Math.sin((t * p.vit + p.ph) * Math.PI * 2 * 0.5)), 6);
          p.m.position.set(cPos.x + Math.cos(p.a) * p.rr, cPos.y + p.y, cPos.z + Math.sin(p.a) * p.rr);
          p.m.scale.setScalar(p.taille * (0.2 + 2.2 * k));
          p.m.rotation.y = t;
        } else if (mode === "aspire") {
          const f = (t * p.vit * 0.35 + p.ph) % 1; // 0 → loin, 1 → au cœur
          const rad = (1 - f) * 3.6 * s + 0.3 * s, ang = p.a + f * 2.5;
          p.m.position.set(cPos.x + Math.cos(ang) * rad, cPos.y + p.y * (1 - f) * 0.7, cPos.z + Math.sin(ang) * rad);
          p.m.scale.setScalar(p.taille * 1.3 * Math.sin(f * Math.PI));
        } else {
          const f = (t * p.vit * (mode === "braises" ? 0.45 : 0.3) + p.ph) % 1;
          const ond = mode === "braises" ? Math.sin(t * 3 + p.a * 5) * 0.35 * s : 0;
          const rad = p.rr * (mode === "braises" ? 0.7 : 1);
          p.m.position.set(cPos.x + Math.cos(p.a) * rad + ond, cPos.y - 0.6 * s + f * 4 * s, cPos.z + Math.sin(p.a) * rad);
          p.m.scale.setScalar(p.taille * Math.sin(f * Math.PI) * 1.4);
        }
      }
    });
  }
}

function texteSpeciaux(sp) {
  if (!sp) return "";
  const l = [];
  if (sp.geant) l.push(sp.geant > 1 ? `bouquet de ${sp.geant} cristaux géants` : "cristal géant au sommet");
  if (sp.eclats) l.push(`${sp.eclats} éclats en lévitation`);
  if (sp.anneau) l.push("anneau de runes tournant");
  if (sp.lune) l.push("petite lune flottante");
  if (sp.lueur) l.push("halo lumineux");
  if (sp.pulse) l.push("veines qui pulsent");
  if (sp.etincelles) l.push({ scintille: "scintillements", monte: "étincelles qui montent", braises: "braises", aspire: "particules aspirées" }[sp.etincelles.mode]);
  return l.join(", ");
}

// =====================================================================================
// Scène
// =====================================================================================
const zone = document.getElementById("scene");
const rendu = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
rendu.outputEncoding = THREE.sRGBEncoding;
rendu.toneMapping = THREE.ACESFilmicToneMapping;
rendu.toneMappingExposure = 0.9;
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
zone.prepend(rendu.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15110e);
scene.fog = new THREE.Fog(0x15110e, 30, 90);
if (THREE.RoomEnvironment) {
  const pmrem = new THREE.PMREMGenerator(rendu);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
}

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
const controles = new THREE.OrbitControls(camera, rendu.domElement);
controles.enableDamping = true;
controles.autoRotate = true;
controles.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffe2c0, 0x2a1d14, 0.35));
const cle = new THREE.DirectionalLight(0xffd9a8, 1.15);
cle.position.set(8, 14, 6);
cle.castShadow = true;
cle.shadow.mapSize.set(2048, 2048);
Object.assign(cle.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 80 });
scene.add(cle);
const contre = new THREE.DirectionalLight(0x8fb4ff, 0.7);
contre.position.set(-9, 6, -10);
scene.add(contre);
const lanterne = new THREE.PointLight(0xff9a40, 1.2, 18, 2);
lanterne.position.set(-4, 4, 4);
scene.add(lanterne);

const sol = new THREE.Mesh(new THREE.CircleGeometry(120, 64),
  new THREE.MeshStandardMaterial({ color: lin([38, 33, 29]), roughness: 0.95 }));
sol.rotation.x = -Math.PI / 2;
sol.receiveShadow = true;
scene.add(sol);

const composeur = new THREE.EffectComposer(rendu);
composeur.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), 0.65, 0.5, 0.92);
composeur.addPass(bloom);

function redimensionner() {
  const l = zone.clientWidth, h = zone.clientHeight;
  rendu.setSize(l, h);
  composeur.setSize(l, h);
  camera.aspect = l / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", redimensionner);

// =====================================================================================
// État + interface
// =====================================================================================
const etat = { mode: "un", choix: "Soufre", graine: 7, cailloux: true };
let contenu = new THREE.Group();
scene.add(contenu);
const etiquettes = document.getElementById("etiquettes");
let positionsEtiq = [];

function reconstruire(recadrer) {
  scene.remove(contenu);
  contenu = new THREE.Group();
  etiquettes.innerHTML = "";
  positionsEtiq = [];
  animations = [];
  if (etat.mode === "un") {
    const def = MINERAIS.find((m) => m.id === etat.choix);
    contenu.add(construire(def, new THREE.Matrix4(), etat.graine, !etat.cailloux));
    if (recadrer) {
      controles.target.set(0, 1.4 * def.taille, 0);
      camera.position.set(6.5, 4.2, 7.5).multiplyScalar(def.taille);
    }
  } else {
    const col = 5, ecart = 8.5;
    const lignes = Math.ceil(MINERAIS.length / col);
    MINERAIS.forEach((def, i) => {
      const x = (i % col - (col - 1) / 2) * ecart;
      const z = (Math.floor(i / col) - (lignes - 1) / 2) * ecart;
      contenu.add(construire(def, new THREE.Matrix4().makeTranslation(x, 0, z), etat.graine + i * 31, !etat.cailloux));
      const e = document.createElement("div");
      e.className = "etiq";
      e.textContent = def.nom;
      e.style.color = RARETES[def.rarete].couleur;
      e.onclick = () => choisir(def.id, true);
      etiquettes.appendChild(e);
      positionsEtiq.push({ el: e, p: V(x, 4.6 * def.taille, z) });
    });
    if (recadrer) {
      controles.target.set(0, 0.5, 2);
      camera.position.set(0, 40, 52);
    }
  }
  scene.add(contenu);
}

const hex = (rgb) => "#" + rgb.map((c) => c.toString(16).padStart(2, "0")).join("");
function versLuau(d) {
  const c3 = (rgb) => `Color3.fromRGB(${rgb.join(", ")})`;
  return `\t${d.id} = {rarete = "${d.rarete}", taille = ${d.taille}, couleur = ${c3(d.couleur)}, couleur2 = ${c3(d.couleur2)},\n` +
    `\t\tmateriau = Enum.Material.${d.materiau}, reflet = ${d.reflet}, cristal = ${c3(d.cristal)}, cristalMat = Enum.Material.${d.cristalMat},\n` +
    `\t\tcristaux = ${d.cristaux}, amas = ${d.amas}, veines = ${d.veines}, veine = ${c3(d.veine)}},` +
    (d.speciaux ? `
		-- effets spéciaux à coder en plus : ${texteSpeciaux(d.speciaux)}` : "");
}

function remplirListe() {
  const liste = document.getElementById("liste");
  const ajouterGroupe = (titre, items) => {
    const g = document.createElement("div");
    g.className = "groupe";
    g.textContent = titre;
    liste.appendChild(g);
    for (const d of items) {
      const b = document.createElement("button");
      b.className = "item";
      b.dataset.id = d.id;
      b.innerHTML = `<span class="pastille" style="background:linear-gradient(135deg, ${hex(d.cristal)}, ${hex(d.couleur)})"></span>${d.nom}` +
        (d.enJeu ? `<span class="badge-jeu">en jeu</span>` : `<small style="color:${RARETES[d.rarete].couleur}">${d.rarete}</small>`);
      b.onclick = () => choisir(d.id, true);
      liste.appendChild(b);
    }
  };
  ajouterGroupe("Déjà dans le jeu", MINERAIS.filter((m) => m.enJeu));
  const nouveaux = MINERAIS.filter((m) => !m.enJeu)
    .sort((a, b) => ORDRE_RARETE.indexOf(a.rarete) - ORDRE_RARETE.indexOf(b.rarete) || a.prix - b.prix);
  ajouterGroupe("Propositions (15)", nouveaux);
}

function remplirFiche() {
  const d = MINERAIS.find((m) => m.id === etat.choix);
  const rc = RARETES[d.rarete].couleur;
  const fiche = document.getElementById("fiche");
  fiche.innerHTML = `
    <h2>${d.nom}</h2>
    <span class="rarete" style="color:${rc}; border:1px solid ${rc}">${d.rarete}${d.enJeu ? " · en jeu" : " · proposition"}</span>
    <p>${d.desc}</p>
    <dl>
      <dt>Prix chez Gaspard</dt><dd>${d.prix}${d.enJeu ? "" : " (proposé)"}</dd>
      <dt>Où le trouver</dt><dd>${d.palier}</dd>
      ${d.usage ? `<dt>Idée d'usage</dt><dd>${d.usage}</dd>` : ""}
      ${d.speciaux ? `<dt>Effets spéciaux</dt><dd style="color:${rc}">${texteSpeciaux(d.speciaux)}</dd>` : ""}
      <dt>Roche</dt><dd>${d.materiau}, reflet ${d.reflet}</dd>
      <dt>Cristaux</dt><dd>${d.cristalMat} : ${d.cristaux} isolés, ${d.amas} amas</dd>
      <dt>Veines néon</dt><dd>${d.veines}</dd>
      <dt>Taille</dt><dd>× ${d.taille}</dd>
    </dl>
    <div class="nuancier">
      <span><i style="background:${hex(d.couleur)}"></i>roche</span>
      <span><i style="background:${hex(d.couleur2)}"></i>roche 2</span>
      <span><i style="background:${hex(d.cristal)}"></i>cristal</span>
      <span><i style="background:${hex(d.veine)}"></i>veine</span>
    </div>
    <div class="actions">
      <button class="btn" id="copierUn">Copier le Luau</button>
      <button class="btn" id="copierTous">Copier les 15</button>
    </div>
    <pre>${versLuau(d)}</pre>
    <p class="note">Ce bloc se colle tel quel dans <code>MineraisModeles.VISUEL</code> le jour où on l'ajoute au jeu
      (il faudra aussi le prix, la forge, les grottes et les noms affichés).</p>`;
  document.getElementById("copierUn").onclick = () => copier(versLuau(d));
  document.getElementById("copierTous").onclick = () => copier(MINERAIS.filter((m) => !m.enJeu).map(versLuau).join("\n"));
  document.querySelectorAll(".item").forEach((b) => b.classList.toggle("actif", b.dataset.id === d.id));
}

function copier(texte) {
  const fin = () => montrer("Copié !");
  if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(texte).then(fin, () => repli(texte));
  else repli(texte);
  function repli(t) {
    const z = document.createElement("textarea");
    z.value = t; document.body.appendChild(z); z.select();
    try { document.execCommand("copy"); fin(); } catch (e) { montrer("Copie impossible"); }
    z.remove();
  }
}
function montrer(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(montrer.minuteur);
  montrer.minuteur = setTimeout(() => (el.style.opacity = 0), 1400);
}

function choisir(id, versUn) {
  etat.choix = id;
  if (versUn && etat.mode !== "un") definirMode("un");
  else reconstruire(true);
  remplirFiche();
}
function definirMode(m) {
  etat.mode = m;
  document.getElementById("modeUn").classList.toggle("actif", m === "un");
  document.getElementById("modeTous").classList.toggle("actif", m === "tous");
  reconstruire(true);
}
document.getElementById("modeUn").onclick = () => definirMode("un");
document.getElementById("modeTous").onclick = () => definirMode("tous");
document.getElementById("nouveau").onclick = () => { etat.graine = Math.floor(Math.random() * 1e6); reconstruire(false); };
document.getElementById("cailloux").onclick = (e) => { etat.cailloux = !etat.cailloux; e.target.classList.toggle("actif", etat.cailloux); reconstruire(false); };
document.getElementById("rotation").onclick = (e) => { controles.autoRotate = !controles.autoRotate; e.target.classList.toggle("actif", controles.autoRotate); };

// Lien direct : #tous ou #Rubis
const ancre = decodeURIComponent(location.hash.slice(1));
if (ancre === "tous") etat.mode = "tous";
else if (MINERAIS.some((m) => m.id === ancre)) etat.choix = ancre;

remplirListe();
redimensionner();
definirMode(etat.mode);
remplirFiche();

const tmp = new THREE.Vector3();
const horloge = new THREE.Clock();
(function boucle() {
  requestAnimationFrame(boucle);
  const dt = Math.min(horloge.getDelta(), 0.1), t = horloge.elapsedTime;
  for (const f of animations) f(t, dt);
  controles.update();
  composeur.render();
  if (positionsEtiq.length) {
    const l = zone.clientWidth, h = zone.clientHeight;
    for (const { el, p } of positionsEtiq) {
      tmp.copy(p).project(camera);
      const visible = tmp.z < 1;
      el.style.display = visible ? "" : "none";
      el.style.left = ((tmp.x + 1) / 2 * l) + "px";
      el.style.top = ((1 - tmp.y) / 2 * h) + "px";
    }
  }
})();
</script>
