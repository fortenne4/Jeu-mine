<title>Atelier Bestiaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : établi de nuit — visionneuse 3D à gauche, fiche + scripts Roblox à droite ; une seule colonne sur téléphone. Ambiance sombre assumée (un seul thème). */
:root {
  --bg: #0c111c;
  --panel: #141b2b;
  --panel-2: #1b2438;
  --line: #273250;
  --fg: #e6ebf5;
  --muted: #8c97b0;
  --accent: #ff7a1a;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); margin: 2px 0 0; line-height: 1.1; text-wrap: balance; }
h1 span { color: var(--accent); transition: color .4s; }
.hint { color: var(--muted); font-size: 13px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
#stage { position: relative; width: 100%; height: clamp(340px, 60vh, 580px); cursor: grab; touch-action: none; }
#stage:active { cursor: grabbing; }
#stage canvas { display: block; width: 100%; height: 100%; }
.stage-tip { position: absolute; left: 14px; bottom: 12px; max-width: calc(100% - 170px); font-size: 12px; color: var(--muted); background: rgba(12,17,28,.7); padding: 4px 10px; border-radius: 12px; pointer-events: none; }

.heat { position: absolute; top: 14px; left: 14px; width: min(300px, calc(100% - 28px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.heat-label { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #ffd9b0; text-shadow: 0 0 10px rgba(255,120,30,.6); }
.heat-bar { height: 9px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; border: 1px solid rgba(255,140,60,.4); }
.heat-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ff3d0a, #ffb347 70%, #fff0c8); box-shadow: 0 0 14px #ff7a1a; }
.heat.over .heat-label { color: #bfe6ff; text-shadow: 0 0 12px rgba(90,184,255,.9); animation: pulse .45s infinite alternate; }
.heat.over .heat-bar { border-color: rgba(120,200,255,.6); }
.heat.over .heat-fill { background: linear-gradient(90deg, #2a7cff, #9fd8ff, #ffffff); box-shadow: 0 0 18px #5ab8ff; }
@keyframes pulse { to { opacity: .55; } }
.strike { position: absolute; right: 14px; bottom: 12px; background: var(--accent); color: #160904; border: 0; border-radius: 10px; padding: 10px 18px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; cursor: pointer; box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent); transition: transform .08s; }
.strike:active { transform: scale(.95); }
.strike kbd { font-family: var(--font-mono); font-size: 11px; opacity: .7; margin-left: 6px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.pick { flex: 1 1 140px; min-width: 0; text-align: left; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; transition: border-color .2s, background .2s; }
.pick b { font-family: var(--font-display); font-size: 16px; }
.pick small { color: var(--muted); font-size: 12px; }
.pick:hover { border-color: #3a4870; }
.pick[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel-2)); }
.pick:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 12px; }
.chip-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip-btn[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }

aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 26px; margin: 0; line-height: 1.1; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.tag.el { color: var(--accent); border-color: var(--accent); }
.desc { color: #c2cadb; margin: 0; max-width: 60ch; }
.feats { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: #c2cadb; }
.feats li { padding-left: 16px; position: relative; }
.feats li::before { content: ""; position: absolute; left: 0; top: .55em; width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); box-shadow: 0 0 8px var(--accent); }
.feats b { color: var(--fg); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stat b { font-family: var(--font-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.code-head h3 { margin: 0; font-family: var(--font-display); font-size: 16px; }
.copy { background: var(--accent); color: #12090a; border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.where { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
pre { margin: 0; background: #090d16; border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 320px; overflow: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; color: #b9c6e0; tab-size: 4; }
.steps { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.steps b { color: var(--fg); font-weight: 500; }
[hidden] { display: none !important; }
.ore-label { position: absolute; transform: translate(-50%, 0); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; }
.ore-label b { font-family: var(--font-display); font-weight: 700; font-size: clamp(12px, 1.8vw, 18px); color: #fff; padding: 3px 14px; border-radius: 10px; background: rgba(14, 16, 24, .85); border: 2px solid var(--rc); box-shadow: 0 0 14px color-mix(in srgb, var(--rc) 70%, transparent), inset 0 0 8px color-mix(in srgb, var(--rc) 35%, transparent); }
.ore-label span { font-family: var(--font-display); font-weight: 700; font-size: clamp(10px, 1.4vw, 13px); color: var(--rc); text-shadow: 0 0 8px var(--rc), 0 1px 2px #000; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

-- Pioche de Braise v2 · SCRIPT SERVEUR
-- Où : ServerScriptService > Script
-- Va avec le SCRIPT CLIENT (secousses de caméra, flash, jauge de chaleur).
--
-- Ce qu'elle fait :
--  • Flammes, étincelles et lave qui goutte au bout du pic, traînée de feu à chaque coup
--  • Impact : onde de choc, gerbe de feu, flash de lumière, sol brûlé
--  • Chaque coup ajoute de la chaleur : la pioche chauffe jusqu'au blanc
--  • À 100 % : SURCHAUFFE (feu bleu). Le coup suivant déclenche une ÉRUPTION :
--    double onde de choc, colonne de feu, 8 geysers et dégâts de zone
--  • Brûlure : la cible flambe de partout, perd des PV et finit en cendres si elle meurt
--  • Minerais : ils rougissent à chaque coup puis explosent en éclats brûlants
--  • Aura : halo de feu et braises flottantes ici ; anneaux de runes, braises en orbite
--    et sceau au sol dans le SCRIPT CLIENT
--
-- Minerais : ajoute le tag "Minerai" à tes blocs (Propriétés > Tags),
-- attribut "PV" en option (nombre de coups, 3 par défaut).

local Players = game:GetService("Players")
local CollectionService = game:GetService("CollectionService")
local Debris = game:GetService("Debris")
local TweenService = game:GetService("TweenService")
local ServerStorage = game:GetService("ServerStorage")
local ReplicatedStorage = game:GetService("ReplicatedStorage")

local CONFIG = {
	DEGATS_COUP = 12,          -- dégâts directs du coup
	BRULURE_DEGATS = 4,        -- dégâts par tick de brûlure
	BRULURE_TICKS = 5,         -- nombre de ticks
	BRULURE_INTERVALLE = 0.6,  -- secondes entre deux ticks
	RECHARGE = 0.6,            -- secondes entre deux coups
	PORTEE = 5,                -- studs devant le joueur
	PVP = false,               -- true = la pioche brûle aussi les autres joueurs
	DEGATS_MINERAI = 1,        -- PV retirés à un minerai par coup
	TAG_MINERAI = "Minerai",
	CHALEUR_PAR_COUP = 20,     -- % de chaleur gagné par coup réussi
	CHALEUR_PERTE = 6,         -- % perdu par seconde sans frapper
	ERUPTION_RAYON = 12,       -- studs

	ERUPTION_MINERAI = 3,      -- PV retirés aux minerais pris dans l'éruption

-- ================= Fabriques d'effets =================

local function emetteur(props: {[string]: any}): ParticleEmitter
	local e = Instance.new("ParticleEmitter")
	e.LightEmission = 1
	for cle, valeur in props do
		e[cle] = valeur
	end
	return e
end

local function flammes(): ParticleEmitter
	return emetteur({
		Name = "Flammes",
		Texture = TEX_FEU,
		Color = ColorSequence.new(Color3.fromRGB(255, 210, 110), BRAISE),
		Size = NumberSequence.new(0.5, 0),
		Transparency = NumberSequence.new(0.15, 1),
		Lifetime = NumberRange.new(0.3, 0.6),
		Rate = 30,
		Speed = NumberRange.new(1, 2.5),
		SpreadAngle = Vector2.new(25, 25),
		Acceleration = Vector3.new(0, 6, 0),
		Rotation = NumberRange.new(0, 360),
		RotSpeed = NumberRange.new(-90, 90),
	})
end

local function son(parent: Instance, id: string, volume: number, vitesse: number?)
	local s = Instance.new("Sound")
	s.SoundId = id
	s.Volume = volume
	s.PlaybackSpeed = vitesse or 1
	s.RollOffMaxDistance = 90
	s.Parent = parent
	s:Play()
	Debris:AddItem(s, 4)
end

-- Pièce d'effet ancrée, sans collision, invisible aux détections
local function effetPart(props: {[string]: any}): Part
	local p = Instance.new("Part")
	p.Anchored = true
	p.CanCollide = false
	p.CanQuery = false
	p.CanTouch = false
	p.CastShadow = false
	p.Material = Enum.Material.Neon
	p.TopSurface = Enum.SurfaceType.Smooth
	p.BottomSurface = Enum.SurfaceType.Smooth
	for cle, valeur in props do
		p[cle] = valeur
	end
	p.Parent = workspace
	return p
end

-- Point invisible où accrocher des particules
local function ancre(position: Vector3, duree: number): Part
	local p = effetPart({Transparency = 1, Size = Vector3.new(0.2, 0.2, 0.2), Position = position})
	Debris:AddItem(p, duree)
	return p
end

local function sol(position: Vector3): Vector3?
	local exclus = {}
	for _, j in Players:GetPlayers() do
		if j.Character then
			table.insert(exclus, j.Character)
		end
	end
	local params = RaycastParams.new()
	params.FilterType = Enum.RaycastFilterType.Exclude
	params.FilterDescendantsInstances = exclus
	local r = workspace:Raycast(position + Vector3.new(0, 3, 0), Vector3.new(0, -15, 0), params)
	return r and r.Position or nil
end

local function onde(position: Vector3, rayon: number, couleur: Color3, duree: number)
	local cf = CFrame.new(position) * CFrame.Angles(0, 0, math.rad(90))
	local p = effetPart({Shape = Enum.PartType.Cylinder, Size = Vector3.new(0.15, 1, 1), CFrame = cf, Color = couleur, Transparency = 0.05})
	TweenService:Create(p, TweenInfo.new(duree, Enum.EasingStyle.Quint, Enum.EasingDirection.Out), {
		Size = Vector3.new(0.15, rayon * 2, rayon * 2),
		Transparency = 1,
	}):Play()
	Debris:AddItem(p, duree + 0.1)
end

local function brulureSol(position: Vector3, taille: number)
	local p = sol(position)
	if not p then return end
	local cf = CFrame.new(p + Vector3.new(0, 0.03, 0)) * CFrame.Angles(0, 0, math.rad(90))
	local tache = effetPart({Shape = Enum.PartType.Cylinder, Material = Enum.Material.Slate, Color = CENDRE, Size = Vector3.new(0.05, taille * 2, taille * 2), CFrame = cf, Transparency = 0.1})
	local braise = effetPart({Shape = Enum.PartType.Cylinder, Color = BRAISE, Size = Vector3.new(0.07, taille * 1.3, taille * 1.3), CFrame = cf, Transparency = 0.2})
	TweenService:Create(braise, TweenInfo.new(2), {Transparency = 1, Size = Vector3.new(0.07, taille * 0.3, taille * 0.3)}):Play()
	TweenService:Create(tache, TweenInfo.new(5, Enum.EasingStyle.Quad, Enum.EasingDirection.In), {Transparency = 1}):Play()
	Debris:AddItem(braise, 2.1)
	Debris:AddItem(tache, 5.1)
end

-- Impact : force 1 = coup normal, 3 = éruption
local function impact(position: Vector3, force: number)
	onde(position, 3 + 2 * force, ORANGE, 0.3 + 0.12 * force)

	local a = ancre(position, 3)
	local att = Instance.new("Attachment")
	att.Parent = a

	local f = flammes()
	f.Rate = 0
	f.Speed = NumberRange.new(4, 9)
	f.SpreadAngle = Vector2.new(60, 60)
	f.Size = NumberSequence.new(0.9, 0)
	f.Parent = att
	f:Emit(math.floor(18 * force))

	local e = etincelles()
	e.Rate = 0
	e.Speed = NumberRange.new(10, 22)
	e.SpreadAngle = Vector2.new(80, 80)
	e.Parent = att
	e:Emit(math.floor(30 * force))

	local s = fumee()
	s.Rate = 0
	s.Parent = att
	s:Emit(math.floor(5 * force))

	local l = Instance.new("PointLight")
	l.Color = ORANGE
	l.Brightness = 5 * force
	l.Range = 10 + 5 * force
	l.Parent = a
	TweenService:Create(l, TweenInfo.new(0.35 + 0.1 * force), {Brightness = 0}):Play()

	brulureSol(position, 1 + 0.5 * force)
	fxEvent:FireAllClients("impact", position, force)
end

-- Le minerai explose en éclats brûlants qui refroidissent
local function eclats(bloc: BasePart)
	local taille = math.max(bloc.Size.X, bloc.Size.Y, bloc.Size.Z)
	for i = 1, 12 do
		local t = (0.2 + math.random() * 0.3) * math.min(taille, 4)
		local e = Instance.new("Part")
		e.Size = Vector3.new(t, t, t)
		e.CFrame = bloc.CFrame
			* CFrame.new((math.random() - 0.5) * bloc.Size.X, (math.random() - 0.5) * bloc.Size.Y, (math.random() - 0.5) * bloc.Size.Z)
			* CFrame.Angles(math.random() * 6, math.random() * 6, math.random() * 6)
		e.Color = (i % 3 == 0) and bloc.Color or ORANGE
		e.Material = Enum.Material.Neon
		e.CanQuery = false
		e.CanTouch = false
		e.TopSurface = Enum.SurfaceType.Smooth
		e.BottomSurface = Enum.SurfaceType.Smooth
		e.Parent = workspace
		e.AssemblyLinearVelocity = Vector3.new(math.random(-18, 18), math.random(18, 34), math.random(-18, 18))
		e.AssemblyAngularVelocity = Vector3.new(math.random(-10, 10), math.random(-10, 10), math.random(-10, 10))
		if i % 4 == 0 then
			local f = flammes()
			f.Rate = 15
			f.Size = NumberSequence.new(0.35, 0)
			f.Parent = e
		end
		TweenService:Create(e, TweenInfo.new(1.5), {Color = CENDRE}):Play()
		task.delay(1.6, function()
			if e.Parent then
				TweenService:Create(e, TweenInfo.new(0.5), {Transparency = 1, Size = e.Size * 0.3}):Play()
			end
		end)
		Debris:AddItem(e, 2.2)
	end
	impact(bloc.Position, 1.5)
end

local function frapperMinerai(bloc: BasePart, joueur: Player?, degats: number)
	if not bloc.Parent or not CollectionService:HasTag(bloc, CONFIG.TAG_MINERAI) then return end
	local pvMax = bloc:GetAttribute("PVMax") or bloc:GetAttribute("PV") or 3
	bloc:SetAttribute("PVMax", pvMax)
	local pv = (bloc:GetAttribute("PV") or pvMax) - degats
	bloc:SetAttribute("PV", pv)

	-- Le bloc rougit un peu plus à chaque coup
	local lueur = bloc:FindFirstChild("Chauffe")
	if not lueur then
		lueur = Instance.new("Highlight")
		lueur.Name = "Chauffe"
		lueur.FillColor = ORANGE
		lueur.OutlineColor = BLANC_CHAUD
		lueur.DepthMode = Enum.HighlightDepthMode.Occluded
		lueur.Parent = bloc
	end
	local chauffe = math.clamp(1 - pv / pvMax, 0, 1)
	lueur.FillTransparency = 1 - 0.65 * chauffe
	lueur.OutlineTransparency = 1 - 0.8 * chauffe

	if pv <= 0 then
		CollectionService:RemoveTag(bloc, CONFIG.TAG_MINERAI)
		eclats(bloc)
		mineraiCasse:Fire(joueur, bloc)
		bloc.Transparency = 1
		bloc.CanCollide = false
		bloc.CanQuery = false
		lueur:Destroy()
		Debris:AddItem(bloc, 1)
	end
end

-- La cible tombe en cendres
local function incinerer(perso: Model)
	for _, partie in perso:GetDescendants() do
		if partie:IsA("BasePart") and partie.Transparency < 1 then
			TweenService:Create(partie, TweenInfo.new(0.8), {Color = CENDRE}):Play()
		end
	end
	local racine = perso:FindFirstChild("HumanoidRootPart")
	if racine then
		local att = Instance.new("Attachment")
		att.Parent = racine
		local s = fumee()
		s.Rate = 0
		s.Color = ColorSequence.new(Color3.fromRGB(90, 85, 80))
		s.Parent = att
		s:Emit(25)
		local e = etincelles()
		e.Rate = 0
		e.Parent = att
		e:Emit(40)
		Debris:AddItem(att, 3)
	end
end

-- Brûlure : dégâts sur la durée, la cible flambe de partout. Un nouveau coup prolonge la brûlure.
local function bruler(humanoid: Humanoid)
	local fin = os.clock() + CONFIG.BRULURE_TICKS * CONFIG.BRULURE_INTERVALLE
	local enCours = humanoid:GetAttribute("BrulureFin")
	humanoid:SetAttribute("BrulureFin", fin)
	if enCours and enCours > os.clock() then return end

	local perso = humanoid.Parent
	if not perso then return end

	local effets = {}
	for _, partie in perso:GetChildren() do
		if partie:IsA("BasePart") and partie.Name ~= "HumanoidRootPart" then
			local f = flammes()
			f.Rate = 8
			f.Size = NumberSequence.new(0.7, 0)
			f.Parent = partie
			table.insert(effets, f)
		end
	end
	local racine = perso:FindFirstChild("HumanoidRootPart")
	if racine then
		local feu = Instance.new("Fire")
		feu.Color = ORANGE
		feu.SecondaryColor = BRAISE
		feu.Size = 6
		feu.Heat = 9
		feu.Parent = racine
		table.insert(effets, feu)
		local s = fumee()
		s.Parent = racine
		table.insert(effets, s)
		local l = Instance.new("PointLight")
		l.Color = ORANGE
		l.Brightness = 2
		l.Range = 10
		l.Parent = racine
		table.insert(effets, l)
	end

	task.spawn(function()
		while humanoid.Parent and humanoid.Health > 0 and os.clock() < (humanoid:GetAttribute("BrulureFin") or 0) do
			task.wait(CONFIG.BRULURE_INTERVALLE)
			if humanoid.Health > 0 then
				humanoid:TakeDamage(CONFIG.BRULURE_DEGATS)
			end
		end
		local mort = humanoid.Health <= 0
		for _, ef in effets do
			ef:Destroy()
		end
		humanoid:SetAttribute("BrulureFin", nil)
		if mort and perso.Parent then
			incinerer(perso)
		end
	end)
end

local function toucherCible(cible: Humanoid, modele: Model, degats: number): boolean
	if cible.Health <= 0 then return false end
	if not CONFIG.PVP and Players:GetPlayerFromCharacter(modele) then return false end
	cible:TakeDamage(degats)
	bruler(cible)
	return true
end

local function eruption(position: Vector3, perso: Model, joueur: Player?)
	local base = sol(position) or position
	impact(position, 3)

	local a = ancre(base, 4)
	son(a, SONS.ERUPTION, 1, 0.6)

	task.delay(0.08, function()
		onde(base + Vector3.new(0, 0.2, 0), CONFIG.ERUPTION_RAYON, BLANC_CHAUD, 0.55)
	end)
	task.delay(0.2, function()
		onde(base + Vector3.new(0, 0.2, 0), CONFIG.ERUPTION_RAYON * 1.4, BRAISE, 0.9)
	end)

	-- Colonne de feu
	local colonne = effetPart({
		Shape = Enum.PartType.Cylinder,
		Color = BLANC_CHAUD,
		Size = Vector3.new(1, 3, 3),
		CFrame = CFrame.new(base) * CFrame.Angles(0, 0, math.rad(90)),
	})
	TweenService:Create(colonne, TweenInfo.new(0.6, Enum.EasingStyle.Quint, Enum.EasingDirection.Out), {
		Size = Vector3.new(30, 6, 6),
		CFrame = CFrame.new(base + Vector3.new(0, 15, 0)) * CFrame.Angles(0, 0, math.rad(90)),
		Transparency = 1,
		Color = ORANGE,
	}):Play()
	Debris:AddItem(colonne, 0.7)

	local att = Instance.new("Attachment")
	att.Parent = a
	local jet = flammes()
	jet.Rate = 0
	jet.Speed = NumberRange.new(25, 45)
	jet.SpreadAngle = Vector2.new(8, 8)
	jet.Size = NumberSequence.new(2.2, 0)
	jet.Lifetime = NumberRange.new(0.6, 1)
	jet.Acceleration = Vector3.zero
	jet.Parent = att
	jet:Emit(60)

	-- Cercle de geysers
	for i = 1, 8 do
		local angle = (i / 8) * math.pi * 2
		local p = base + Vector3.new(math.cos(angle), 0, math.sin(angle)) * CONFIG.ERUPTION_RAYON * 0.65
		task.delay(0.15 + 0.04 * i, function()
			local g = ancre(p, 2.5)
			local ga = Instance.new("Attachment")
			ga.Parent = g
			local f = flammes()
			f.Rate = 0
			f.Speed = NumberRange.new(14, 24)
			f.SpreadAngle = Vector2.new(10, 10)
			f.Size = NumberSequence.new(1.4, 0)
			f.Lifetime = NumberRange.new(0.5, 0.9)
			f.Parent = ga
			f:Emit(22)
			local e = etincelles()
			e.Rate = 0
			e.Speed = NumberRange.new(12, 20)
			e.Parent = ga
			e:Emit(15)
			brulureSol(p, 1.6)
		end)
	end

	fxEvent:FireAllClients("eruption", position, 3)

	-- Dégâts de zone
	local params = OverlapParams.new()
	params.FilterType = Enum.RaycastFilterType.Exclude
	params.FilterDescendantsInstances = {perso}
	local vus = {}
	for _, partie in workspace:GetPartBoundsInRadius(base, CONFIG.ERUPTION_RAYON, params) do
		local modele = partie:FindFirstAncestorOfClass("Model")
		local cible = modele and modele:FindFirstChildOfClass("Humanoid")
		if cible then
			if not vus[cible] then
				vus[cible] = true
				toucherCible(cible, modele, CONFIG.ERUPTION_DEGATS)
			end
		elseif CollectionService:HasTag(partie, CONFIG.TAG_MINERAI) and not vus[partie] then
			vus[partie] = true
			frapperMinerai(partie, joueur, CONFIG.ERUPTION_MINERAI)
		end
	end
end

-- ================= L'outil =================

local function creerPioche(): Tool
	local tool = Instance.new("Tool")
	tool.Name = "Pioche de Braise"
	tool.ToolTip = "Enflamme tout ce qu'elle frappe"
	tool.CanBeDropped = false
	tool.Grip = GRIP

	local handle
	local neons = {}
	for i, d in ipairs(PARTS) do
		local p = Instance.new("Part")
		p.Name = d[1]
		p.Size = d[2]
		p.Color = d[4]
		p.Material = d[5]
		p.CanCollide = false
		p.Massless = true
		p.TopSurface = Enum.SurfaceType.Smooth
		p.BottomSurface = Enum.SurfaceType.Smooth
		if i == 1 then
			handle = p
			p.CFrame = d[3]
		else
			p.CFrame = handle.CFrame * d[3]
			local weld = Instance.new("WeldConstraint")
			weld.Part0 = handle
			weld.Part1 = p
			weld.Parent = p
		end
		if d[5] == Enum.Material.Neon then
			table.insert(neons, {partie = p, couleur = d[4]})
		end
		p.Parent = tool
	end

	-- Effets permanents au bout du pic
	local pointe = Instance.new("Attachment")
	pointe.Name = "Pointe"
	pointe.CFrame = CFrame.new(0, 1.7, -2.3)
	pointe.Parent = handle
	local flammesPointe = flammes()
	flammesPointe.Parent = pointe
	etincelles().Parent = pointe
	gouttesLave().Parent = pointe

	-- Aura de chaleur autour de la tête (visible quand la pioche est bien chaude)
	local centre = Instance.new("Attachment")
	centre.Name = "Centre"
	centre.CFrame = CFrame.new(0, 2.05, 0)
	centre.Parent = handle
	local aura = emetteur({
		Name = "Aura",
		Texture = TEX_FEU,
		Color = ColorSequence.new(ORANGE),
		Size = NumberSequence.new(1.6, 0.4),
		Transparency = NumberSequence.new(0.75, 1),
		Lifetime = NumberRange.new(0.4, 0.7),
		Rate = 6,
		Speed = NumberRange.new(0.5, 1),
		SpreadAngle = Vector2.new(180, 180),
	})
	aura.Parent = centre

	-- Braises qui flottent autour de la tête
	local braisesFlottantes = emetteur({
		Name = "BraisesFlottantes",
		Texture = TEX_ETINCELLE,
		Color = ColorSequence.new(Color3.fromRGB(255, 220, 140), ORANGE),
		Size = NumberSequence.new(0.14, 0),
		Lifetime = NumberRange.new(1, 1.6),
		Rate = 6,
		Speed = NumberRange.new(0.3, 0.8),
		SpreadAngle = Vector2.new(180, 180),
		Acceleration = Vector3.new(0, 1.5, 0),
		LockedToPart = true,
	})
	braisesFlottantes.Parent = centre

	-- Traînée de feu pendant la frappe
	local t0 = Instance.new("Attachment")
	t0.CFrame = CFrame.new(0, 1.75, -2.2)
	t0.Parent = handle
	local t1 = Instance.new("Attachment")
	t1.CFrame = CFrame.new(0, 2.4, -0.4)
	t1.Parent = handle
	local trainee = Instance.new("Trail")
	trainee.Attachment0 = t0
	trainee.Attachment1 = t1
	trainee.Lifetime = 0.22
	trainee.LightEmission = 1
	trainee.Color = ColorSequence.new(BLANC_CHAUD, BRAISE)
	trainee.Transparency = NumberSequence.new(0.1, 1)
	trainee.WidthScale = NumberSequence.new(1, 0.3)
	trainee.Enabled = false
	trainee.Parent = handle

	local lumiere = Instance.new("PointLight")
	lumiere.Color = ORANGE
	lumiere.Brightness = 2
	lumiere.Range = 9
	lumiere.Parent = tool:FindFirstChild("Tete")

	-- ===== Chaleur =====
	local chaleur = 0
	local derniere = -1
	tool:SetAttribute("Chaleur", 0)

	local function appliquerChaleur()
		local h = chaleur / 100
		if math.abs(h - derniere) < 0.02 then return end
		derniere = h
		local surchauffe = chaleur >= 100
		for _, n in neons do
			n.partie.Color = surchauffe and BLEU or n.couleur:Lerp(BLANC_CHAUD, h * 0.8)
		end
		lumiere.Color = surchauffe and BLEU or ORANGE
		lumiere.Brightness = 2 + 5 * h
		lumiere.Range = 9 + 7 * h
		flammesPointe.Rate = 30 + 60 * h
		flammesPointe.Color = surchauffe
			and ColorSequence.new(Color3.fromRGB(210, 245, 255), Color3.fromRGB(40, 120, 255))
			or ColorSequence.new(Color3.fromRGB(255, 210, 110), BRAISE)
		aura.Rate = 6 + 24 * h
		aura.Color = ColorSequence.new(surchauffe and BLEU or ORANGE)
		braisesFlottantes.Rate = 6 + 14 * h
		braisesFlottantes.Color = surchauffe
			and ColorSequence.new(Color3.fromRGB(220, 245, 255), BLEU)
			or ColorSequence.new(Color3.fromRGB(255, 220, 140), ORANGE)
		trainee.Color = surchauffe
			and ColorSequence.new(Color3.fromRGB(220, 245, 255), BLEU)
			or ColorSequence.new(BLANC_CHAUD, BRAISE)
		tool:SetAttribute("Chaleur", math.floor(chaleur + 0.5))
	end
	appliquerChaleur()

	task.defer(function()
		while tool.Parent do
			local dt = task.wait(0.1)
			if chaleur > 0 and chaleur < 100 then
				chaleur = math.max(0, chaleur - CONFIG.CHALEUR_PERTE * dt)
				appliquerChaleur()
			end
		end
	end)

	-- ===== Frappe =====
	local dernierCoup = 0
	local occupe = false

	local function coup()
		local perso = tool.Parent
		if not perso or not perso:IsA("Model") then return end
		local humanoid = perso:FindFirstChildOfClass("Humanoid")
		local racine = perso:FindFirstChild("HumanoidRootPart")
		if not humanoid or humanoid.Health <= 0 or not racine then return end
		if occupe or os.clock() - dernierCoup < CONFIG.RECHARGE then return end
		dernierCoup = os.clock()
		occupe = true

		-- Mouvement de frappe (pas besoin d'animation importée)
		trainee.Enabled = true
		son(handle, SONS.FRAPPE, 0.6, 0.9 + math.random() * 0.2)
		task.spawn(function()
			for _, etape in ipairs({{35, 0.07}, {70, 0.07}, {-40, 0.05}, {-25, 0.08}, {0, 0.08}}) do
				tool.Grip = GRIP * CFrame.Angles(math.rad(etape[1]), 0, 0)
				task.wait(etape[2])
			end
			trainee.Enabled = false
			occupe = false
		end)

		task.wait(0.17)
		if tool.Parent ~= perso then return end

		local params = OverlapParams.new()
		params.FilterType = Enum.RaycastFilterType.Exclude
		params.FilterDescendantsInstances = {perso}
		local zone = racine.CFrame * CFrame.new(0, -0.5, -CONFIG.PORTEE / 2)
		local touches = workspace:GetPartBoundsInBox(zone, Vector3.new(4, 6, CONFIG.PORTEE), params)

		local joueur = Players:GetPlayerFromCharacter(perso)
		local cibles = {}
		local minerai, distMin = nil, math.huge
		for _, partie in touches do
			local modele = partie:FindFirstAncestorOfClass("Model")
			local cible = modele and modele:FindFirstChildOfClass("Humanoid")
			if cible then
				cibles[cible] = modele
			elseif CollectionService:HasTag(partie, CONFIG.TAG_MINERAI) then
				local d = (partie.Position - racine.Position).Magnitude
				if d < distMin then
					minerai, distMin = partie, d
				end
			end
		end

		local surchauffe = chaleur >= 100
		local aTouche = minerai ~= nil
		local point = minerai and (minerai.Position + Vector3.new(0, minerai.Size.Y / 2, 0)) or nil
		for cible, modele in cibles do
			local degats = surchauffe and 0 or CONFIG.DEGATS_COUP -- en surchauffe, l'éruption s'en charge
			if surchauffe and cible.Health > 0 and (CONFIG.PVP or not Players:GetPlayerFromCharacter(modele)) then
				aTouche = true
			elseif degats > 0 and toucherCible(cible, modele, degats) then
				aTouche = true
			end
			if aTouche and not point then
				local r = modele:FindFirstChild("HumanoidRootPart")
				point = r and r.Position or nil
			end
		end
		point = point or (racine.Position + racine.CFrame.LookVector * 3)

		if not aTouche then
			-- Coup dans le vide : quelques étincelles au sol
			local p = sol(racine.Position + racine.CFrame.LookVector * 3)
			if p then
				local a = ancre(p, 1.5)
				local att = Instance.new("Attachment")
				att.Parent = a
				local e = etincelles()
				e.Rate = 0
				e.Parent = att
				e:Emit(12)
			end
			return
		end

		if surchauffe then
			chaleur = 0
			appliquerChaleur()
			eruption(point, perso, joueur)
		else
			chaleur = math.min(100, chaleur + CONFIG.CHALEUR_PAR_COUP)
			appliquerChaleur()
			impact(point, 1)
			if minerai then
				frapperMinerai(minerai, joueur, CONFIG.DEGATS_MINERAI)
			end
		end
	end

	tool.Activated:Connect(coup)
	tool.Equipped:Connect(function()
		son(handle, SONS.EQUIPER, 0.5)
	end)
	return tool
end

-- ================= Distribution =================

local function donnerPioche(joueur: Player)
	local sac = joueur:WaitForChild("Backpack")
	if not sac:FindFirstChild("Pioche de Braise") then
		creerPioche().Parent = sac
	end
end

local function surJoueur(joueur: Player)
	joueur.CharacterAdded:Connect(function()
		donnerPioche(joueur)
	end)
	if joueur.Character then
		donnerPioche(joueur)
	end
end

Players.PlayerAdded:Connect(surJoueur)
for _, joueur in Players:GetPlayers() do
	surJoueur(joueur)
end
</script>

<script type="text/plain" id="luau-pioche-client">
-- Pioche de Braise v2 · SCRIPT CLIENT
-- Où : StarterPlayer > StarterPlayerScripts > LocalScript
-- Ce que seul ton écran voit : secousses de caméra, flash, zoom de l'éruption,
-- l'aura (anneaux de runes, braises en orbite, sceau au sol)
-- et la jauge de chaleur quand tu tiens la pioche.

local Players = game:GetService("Players")
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local RunService = game:GetService("RunService")
local Lighting = game:GetService("Lighting")
local TweenService = game:GetService("TweenService")

local joueur = Players.LocalPlayer
local fxEvent = ReplicatedStorage:WaitForChild("PiocheFX")

local NOM_OUTIL = "Pioche de Braise"
local ORANGE = Color3.fromRGB(255, 120, 30)
local BLANC_CHAUD = Color3.fromRGB(255, 236, 190)
local BLEU = Color3.fromRGB(110, 200, 255)
local BLANC = Color3.new(1, 1, 1)

-- ================= Secousse, flash et zoom =================

local secousse = 0
local FOV_BASE = workspace.CurrentCamera.FieldOfView

local flash = Instance.new("ColorCorrectionEffect")
flash.Name = "PiocheFlash"
flash.Parent = Lighting

local function eclair(force: number, couleur: Color3)
	flash.TintColor = BLANC:Lerp(couleur, math.clamp(force * 0.25, 0, 0.6))
	flash.Brightness = 0.06 * force
	flash.Contrast = 0.08 * force
	TweenService:Create(flash, TweenInfo.new(0.3 + 0.1 * force), {
		TintColor = BLANC,
		Brightness = 0,
		Contrast = 0,
	}):Play()
end

fxEvent.OnClientEvent:Connect(function(genre: string, position: Vector3, force: number)
	local camera = workspace.CurrentCamera
	local distance = (position - camera.CFrame.Position).Magnitude
	local proche = math.clamp(1 - distance / 80, 0, 1)
	if proche <= 0 then return end

	secousse = math.max(secousse, force * proche)
	if genre == "eruption" then
		eclair(force * proche, BLEU)
		local monte = TweenService:Create(camera, TweenInfo.new(0.1, Enum.EasingStyle.Quad, Enum.EasingDirection.Out), {
			FieldOfView = FOV_BASE + 14 * proche,
		})
		monte:Play()
		monte.Completed:Once(function()
			TweenService:Create(camera, TweenInfo.new(0.6, Enum.EasingStyle.Quad, Enum.EasingDirection.Out), {
				FieldOfView = FOV_BASE,
			}):Play()
		end)
	else
		eclair(force * proche, ORANGE)
	end
end)

RunService:BindToRenderStep("PiocheSecousse", Enum.RenderPriority.Camera.Value + 1, function(dt)
	if secousse < 0.01 then
		secousse = 0
		return
	end
	local camera = workspace.CurrentCamera
	local t = os.clock() * 30
	local rx = math.noise(t, 0.31) * secousse * 0.04
	local ry = math.noise(0.73, t) * secousse * 0.04
	local rz = math.noise(t, t * 0.5) * secousse * 0.02
	camera.CFrame = camera.CFrame * CFrame.Angles(rx, ry, rz)
	secousse *= math.exp(-dt * 6)
end)

-- ================= Aura de la pioche =================
-- Chaque client dessine l'aura de toutes les pioches équipées (la sienne et celles des autres).
-- Les pièces vivent dans la caméra : elles ne sont pas répliquées et restent fluides.

local auras = {}

local function cubeNeon(parent: Instance, taille: Vector3): Part
	local p = Instance.new("Part")
	p.Anchored = true
	p.CanCollide = false
	p.CanQuery = false
	p.CanTouch = false
	p.CastShadow = false
	p.Material = Enum.Material.Neon
	p.Size = taille
	p.Color = ORANGE
	p.TopSurface = Enum.SurfaceType.Smooth
	p.BottomSurface = Enum.SurfaceType.Smooth
	p.Parent = parent
	return p
end

local function creerAura()
	local dossier = Instance.new("Folder")
	dossier.Name = "AuraPioche"
	dossier.Parent = workspace.CurrentCamera
	local a = {dossier = dossier, anneau1 = {}, anneau2 = {}, braises = {}, hexagone = {}}
	for i = 1, 12 do a.anneau1[i] = cubeNeon(dossier, Vector3.new(0.12, 0.06, 0.2)) end
	for i = 1, 9 do a.anneau2[i] = cubeNeon(dossier, Vector3.new(0.1, 0.05, 0.17)) end
	for i = 1, 6 do a.braises[i] = cubeNeon(dossier, Vector3.new(0.16, 0.16, 0.16)) end
	for i = 1, 6 do a.hexagone[i] = cubeNeon(dossier, Vector3.new(2.2, 0.05, 0.12)) end
	a.disque = cubeNeon(dossier, Vector3.new(0.04, 4.4, 4.4))
	a.disque.Shape = Enum.PartType.Cylinder
	a.cercle = cubeNeon(dossier, Vector3.new(0.05, 2.6, 2.6))
	a.cercle.Shape = Enum.PartType.Cylinder
	return a
end

local function placerAura(a, handle: BasePart, racine: BasePart, humanoid: Humanoid, chaleur: number, t: number)
	local h = math.clamp(chaleur / 100, 0, 1)
	local surchauffe = chaleur >= 100
	local couleur = surchauffe and BLEU or ORANGE:Lerp(BLANC_CHAUD, h * 0.55)
	local vitesse = 1 + 2 * h

	-- Anneaux de runes autour de la tête de la pioche
	local tete = handle.CFrame * CFrame.new(0, 2.05, -0.3)
	local cf1 = tete * CFrame.Angles(1.15, 0, 0.2) * CFrame.Angles(0, t * vitesse, 0)
	for i, p in a.anneau1 do
		local ang = (i / #a.anneau1) * math.pi * 2
		p.CFrame = cf1 * CFrame.Angles(0, ang, 0) * CFrame.new(1.15, 0, 0)
		p.Color = couleur
		p.Transparency = 0.35 - 0.3 * h
	end
	local cf2 = tete * CFrame.Angles(0.4, 0, 1.0) * CFrame.Angles(0, -t * vitesse * 0.8, 0)
	for i, p in a.anneau2 do
		local ang = (i / #a.anneau2) * math.pi * 2
		p.CFrame = cf2 * CFrame.Angles(0, ang, 0) * CFrame.new(1.45, 0, 0)
		p.Color = couleur
		p.Transparency = 0.35 - 0.3 * h
	end

	-- Braises en orbite
	for i, p in a.braises do
		local ang = t * (1.5 + h) + i * math.pi / 3
		local r = 1.5 + 0.15 * math.sin(t * 2 + i)
		p.CFrame = handle.CFrame
			* CFrame.new(math.cos(ang) * r, 2.05 + math.sin(t * 3 + i) * 0.5, -0.3 + math.sin(ang) * r)
			* CFrame.Angles(t * 3 + i, t * 2, 0)
		p.Color = couleur
	end

	-- Sceau de feu au sol, sous le joueur
	local y = racine.Position.Y - (humanoid.HipHeight + racine.Size.Y / 2) + 0.05
	local base = CFrame.new(racine.Position.X, y, racine.Position.Z) * CFrame.Angles(0, t * 0.5, 0)
	local apotheme = 2.2 * math.cos(math.rad(30))
	for i, p in a.hexagone do
		local theta = math.rad(i * 60 + 30)
		p.CFrame = base * CFrame.new(math.cos(theta) * apotheme, 0, math.sin(theta) * apotheme) * CFrame.Angles(0, -(theta + math.pi / 2), 0)
		p.Color = couleur
		p.Transparency = 0.45 - 0.3 * h
	end
	local plat = CFrame.Angles(0, 0, math.rad(90))
	a.disque.CFrame = CFrame.new(base.Position) * plat
	a.disque.Color = couleur
	a.disque.Transparency = 0.9 - 0.12 * h - 0.04 * math.sin(t * 4)
	local s = 2.6 * (1 + 0.05 * math.sin(t * 4))
	a.cercle.Size = Vector3.new(0.05, s, s)
	a.cercle.CFrame = CFrame.new(base.Position + Vector3.new(0, 0.01, 0)) * plat
	a.cercle.Color = couleur
	a.cercle.Transparency = 0.75 - 0.25 * h
end

RunService.RenderStepped:Connect(function()
	local t = os.clock()
	local vues = {}
	for _, j in Players:GetPlayers() do
		local perso = j.Character
		local outil = perso and perso:FindFirstChild(NOM_OUTIL)
		local handle = outil and outil:FindFirstChild("Handle")
		local racine = perso and perso:FindFirstChild("HumanoidRootPart")
		local humanoid = perso and perso:FindFirstChildOfClass("Humanoid")
		if handle and racine and humanoid and humanoid.Health > 0 then
			vues[outil] = true
			local a = auras[outil]
			if not a then
				a = creerAura()
				auras[outil] = a
			end
			placerAura(a, handle, racine, humanoid, outil:GetAttribute("Chaleur") or 0, t)
		end
	end
	for outil, a in auras do
		if not vues[outil] then
			a.dossier:Destroy()
			auras[outil] = nil
		end
	end
end)

-- ================= Jauge de chaleur =================

local gui = Instance.new("ScreenGui")
gui.Name = "PiocheChaleur"
gui.ResetOnSpawn = false
gui.Enabled = false
gui.Parent = joueur:WaitForChild("PlayerGui")

local cadre = Instance.new("Frame")
cadre.AnchorPoint = Vector2.new(0.5, 1)
cadre.Position = UDim2.new(0.5, 0, 1, -100)
cadre.Size = UDim2.fromOffset(280, 12)
cadre.BackgroundColor3 = Color3.fromRGB(25, 18, 15)
cadre.BorderSizePixel = 0
cadre.Parent = gui

local coin = Instance.new("UICorner")
coin.CornerRadius = UDim.new(1, 0)
coin.Parent = cadre

local contour = Instance.new("UIStroke")
contour.Color = ORANGE
contour.Thickness = 1.5
contour.Transparency = 0.3
contour.Parent = cadre

local rempli = Instance.new("Frame")
rempli.Size = UDim2.fromScale(0, 1)
rempli.BackgroundColor3 = ORANGE
rempli.BorderSizePixel = 0
rempli.Parent = cadre

local coin2 = Instance.new("UICorner")
coin2.CornerRadius = UDim.new(1, 0)
coin2.Parent = rempli

local texte = Instance.new("TextLabel")
texte.BackgroundTransparency = 1
texte.AnchorPoint = Vector2.new(0.5, 1)
texte.Position = UDim2.new(0.5, 0, 0, -4)
texte.Size = UDim2.new(1, 160, 0, 20)
texte.Font = Enum.Font.GothamBold
texte.TextSize = 15
texte.TextColor3 = BLANC
texte.TextStrokeTransparency = 0.4
texte.Parent = cadre

local affichee = 0
RunService.RenderStepped:Connect(function(dt)
	local perso = joueur.Character
	local outil = perso and perso:FindFirstChild(NOM_OUTIL)
	gui.Enabled = outil ~= nil
	if not outil then return end

	local chaleur = (outil:GetAttribute("Chaleur") or 0) / 100
	affichee += (chaleur - affichee) * math.min(1, dt * 12)
	rempli.Size = UDim2.fromScale(affichee, 1)

	if chaleur >= 1 then
		local p = (math.sin(os.clock() * 12) + 1) / 2
		rempli.BackgroundColor3 = BLEU:Lerp(BLANC, p * 0.5)
		contour.Color = BLEU
		texte.Text = "SURCHAUFFE · prochain coup = ÉRUPTION"
		texte.TextColor3 = BLEU:Lerp(BLANC, p)
	else
		rempli.BackgroundColor3 = ORANGE:Lerp(BLANC_CHAUD, chaleur)
		contour.Color = ORANGE
		texte.Text = "CHALEUR " .. math.floor(chaleur * 100 + 0.5) .. " %"
		texte.TextColor3 = BLANC
	end
end)
</script>

<script type="text/plain" id="luau-minerais-serveur">
-- Minerais · SCRIPT SERVEUR
-- Où : ServerScriptService > Script
-- 4 minerais : Charbon (Commun), Bronze (Peu commun), Fer (Rare), Gold (Légendaire).
-- Ils marchent avec la Pioche de Braise (tag "Minerai") et donnent des Pièces quand on les casse.
-- Chaque minerai : grappe de rochers, amas de cristaux, veines lumineuses, cailloux au sol,
-- et des fissures qui s'allument à chaque coup.
-- Va avec le SCRIPT CLIENT des minerais (éclats en orbite, tourbillons, arcs, rayons, cercle).
--
-- Où ils apparaissent : pose des Parts avec le tag "SpawnMinerai" dans ta map.
-- Elles deviennent invisibles et un minerai pousse dessus, tiré au hasard selon sa rareté.
-- Pour forcer un type, ajoute à la Part un attribut "Type" (Charbon, Bronze, Fer ou Gold).
-- Sans point d'apparition, une rangée de démonstration des 4 minerais apparaît en (0, 0, -25).

local Players = game:GetService("Players")
local CollectionService = game:GetService("CollectionService")
local ServerStorage = game:GetService("ServerStorage")
local TweenService = game:GetService("TweenService")
local Debris = game:GetService("Debris")

local CONFIG = {
	REAPPARITION = 20,                    -- secondes avant qu'un minerai repousse
	TAG_MINERAI = "Minerai",
	TAG_SPAWN = "SpawnMinerai",
	DEMO_POSITION = Vector3.new(0, 0, -25),
	DEMO_ECART = 9,
	MONNAIE = "Pièces",
}

local TEX_ETINCELLE = "rbxasset://textures/particles/sparkles_main.dds"
local TEX_FUMEE = "rbxasset://textures/particles/smoke_main.dds"

local MINERAIS = {
	Charbon = {
		rarete = "Commun", couleurRarete = Color3.fromRGB(184, 188, 198), chance = 60, pv = 2, valeur = 1, taille = 1,
		couleur = Color3.fromRGB(30, 30, 34), couleur2 = Color3.fromRGB(48, 48, 54), materiau = Enum.Material.Slate, reflet = 0.15,
		cristal = Color3.fromRGB(70, 72, 82), cristalMat = Enum.Material.Glass, cristaux = 4, lumiere = nil,
	},
	Bronze = {
		rarete = "Peu commun", couleurRarete = Color3.fromRGB(255, 154, 60), chance = 25, pv = 3, valeur = 3, taille = 1.05,
		couleur = Color3.fromRGB(180, 98, 44), couleur2 = Color3.fromRGB(140, 72, 32), materiau = Enum.Material.Metal, reflet = 0.1,
		cristal = Color3.fromRGB(255, 140, 50), cristalMat = Enum.Material.Neon, cristaux = 5, lumiere = Color3.fromRGB(255, 130, 50),
	},
	Fer = {
		rarete = "Rare", couleurRarete = Color3.fromRGB(79, 141, 255), chance = 12, pv = 5, valeur = 8, taille = 1.1,
		couleur = Color3.fromRGB(152, 158, 170), couleur2 = Color3.fromRGB(112, 118, 130), materiau = Enum.Material.Metal, reflet = 0.25,
		cristal = Color3.fromRGB(175, 215, 255), cristalMat = Enum.Material.Glass, cristaux = 6, lumiere = Color3.fromRGB(140, 190, 255),
	},
	Gold = {
		rarete = "Légendaire", couleurRarete = Color3.fromRGB(179, 92, 255), chance = 3, pv = 8, valeur = 25, taille = 1.2,
		couleur = Color3.fromRGB(255, 196, 48), couleur2 = Color3.fromRGB(232, 160, 30), materiau = Enum.Material.Foil, reflet = 0.2,
		cristal = Color3.fromRGB(255, 226, 120), cristalMat = Enum.Material.Neon, cristaux = 8, lumiere = Color3.fromRGB(255, 200, 60),
	},
}
local ORDRE = {"Charbon", "Bronze", "Fer", "Gold"}

-- Détails : {amas de cristaux, veines lumineuses, couleur des veines et fissures}
local DETAILS = {
	Charbon = {1, 3, Color3.fromRGB(140, 35, 12)},   -- braises qui couvent
	Bronze = {2, 5, Color3.fromRGB(255, 160, 70)},   -- lave
	Fer = {2, 5, Color3.fromRGB(160, 215, 255)},     -- givre bleu
	Gold = {3, 6, Color3.fromRGB(255, 245, 190)},    -- or blanc
}
for nom, d in DETAILS do
	MINERAIS[nom].amas, MINERAIS[nom].veines, MINERAIS[nom].veine = d[1], d[2], d[3]
end
MINERAIS.Charbon.cristal = Color3.fromRGB(14, 14, 20) -- obsidienne

local dossier = Instance.new("Folder")
dossier.Name = "Minerais"
dossier.Parent = workspace

local function emetteur(parent: Instance, props: {[string]: any}): ParticleEmitter
	local e = Instance.new("ParticleEmitter")
	e.LightEmission = 1
	for cle, valeur in props do
		e[cle] = valeur
	end
	e.Parent = parent
	return e
end

local function piece(parent: Instance, nom: string, taille: Vector3, cf: CFrame, couleur: Color3, materiau: Enum.Material): Part
	local p = Instance.new("Part")
	p.Name = nom
	p.Size = taille
	p.CFrame = cf
	p.Color = couleur
	p.Material = materiau
	p.Anchored = true
	p.TopSurface = Enum.SurfaceType.Smooth
	p.BottomSurface = Enum.SurfaceType.Smooth
	p.Parent = parent
	return p
end

-- Rocher taillé : un cœur + des blocs inclinés (facettes) + des cristaux qui dépassent
local function construire(nom: string, sol: CFrame): (Model, Part)
	local def = MINERAIS[nom]
	local rng = Random.new()
	local s = def.taille
	local modele = Instance.new("Model")
	modele.Name = "Minerai_" .. nom

	local centre = sol * CFrame.new(0, 1.25 * s, 0) * CFrame.Angles(0, rng:NextNumber(0, math.pi * 2), 0)
	local coeur = piece(modele, "Coeur", Vector3.new(2.3, 2, 2.2) * s,
		centre * CFrame.Angles(rng:NextNumber(-0.2, 0.2), 0, rng:NextNumber(-0.2, 0.2)), def.couleur, def.materiau)
	coeur.Reflectance = def.reflet

	local function decor(p: Part)
		p.CanQuery = false
		p.CanCollide = false
		if p.Material == Enum.Material.Glass then
			p.Transparency = 0.15
			p.Reflectance = 0.35
		end
	end

	-- Facettes : blocs inclinés autour d'un centre
	local function facettes(c: Vector3, rayon: number, nombre: number, echelle: number)
		for i = 1, nombre do
			local dir = Vector3.new(rng:NextNumber(-1, 1), rng:NextNumber(-0.5, 1), rng:NextNumber(-1, 1)).Unit
			local t = Vector3.new(rng:NextNumber(1, 1.6), rng:NextNumber(0.8, 1.4), rng:NextNumber(1, 1.6)) * s * echelle
			local cf = CFrame.new(c + dir * rayon)
				* CFrame.Angles(rng:NextNumber(0, 6.28), rng:NextNumber(0, 6.28), rng:NextNumber(0, 6.28))
			local p = piece(modele, "Facette", t, cf, (i % 2 == 0) and def.couleur or def.couleur2, def.materiau)
			p.Reflectance = def.reflet
			p.CanQuery = false
		end
	end
	facettes(centre.Position, 0.8 * s, 14, 1)

	-- Petits rochers soudés au bloc principal
	for _, decalage in {Vector3.new(1.3, -0.5, 0.6), Vector3.new(-1.2, -0.6, -0.5), Vector3.new(0.2, -0.8, -1.2)} do
		facettes((centre * CFrame.new(decalage * s)).Position, 0.35 * s, 5, 0.5)
	end

	-- Cristaux isolés
	for _ = 1, def.cristaux do
		local dir = Vector3.new(rng:NextNumber(-1, 1), rng:NextNumber(-0.1, 1), rng:NextNumber(-1, 1)).Unit
		local pos = centre.Position + dir * 1.2 * s
		local h = rng:NextNumber(0.5, 0.95) * s
		local cf = CFrame.lookAt(pos, pos + dir) * CFrame.Angles(-math.pi / 2, 0, 0) * CFrame.Angles(0, math.rad(45), 0)
		decor(piece(modele, "Cristal", Vector3.new(0.28 * s, h, 0.28 * s), cf, def.cristal, def.cristalMat))
	end

	-- Amas de cristaux : prisme + pointe en diamant, groupés par 3
	for a = 1, def.amas do
		local angle = a * 2.4 + rng:NextNumber(0, 1)
		local dir = Vector3.new(math.cos(angle), rng:NextNumber(0.25, 0.9), math.sin(angle)).Unit
		local base = centre.Position + dir * 1.0 * s
		for _ = 1, 3 do
			local d2 = (dir + Vector3.new(rng:NextNumber(-0.4, 0.4), rng:NextNumber(-0.2, 0.2), rng:NextNumber(-0.4, 0.4))).Unit
			local pos = base + Vector3.new(rng:NextNumber(-0.2, 0.2), rng:NextNumber(-0.2, 0.2), rng:NextNumber(-0.2, 0.2)) * s
			local h = rng:NextNumber(0.6, 1.2) * s
			local r = rng:NextNumber(0.22, 0.34) * s
			local axe = CFrame.lookAt(pos, pos + d2) * CFrame.Angles(-math.pi / 2, 0, 0)
			decor(piece(modele, "Cristal", Vector3.new(r, h, r), axe * CFrame.new(0, h / 2, 0) * CFrame.Angles(0, math.rad(45), 0), def.cristal, def.cristalMat))
			decor(piece(modele, "Pointe", Vector3.new(r * 0.72, r * 0.72, r * 0.72), axe * CFrame.new(0, h, 0) * CFrame.Angles(math.rad(45), 0, math.rad(45)), def.cristal, def.cristalMat))
		end
	end

	-- Veines lumineuses à la surface
	for _ = 1, def.veines do
		local dir = Vector3.new(rng:NextNumber(-1, 1), rng:NextNumber(-0.6, 1), rng:NextNumber(-1, 1)).Unit
		local pos = centre.Position + dir * 1.12 * s
		local tangente = dir:Cross(Vector3.new(rng:NextNumber(-1, 1), rng:NextNumber(-1, 1), rng:NextNumber(-1, 1))).Unit
		decor(piece(modele, "Veine", Vector3.new(0.09, 0.09, rng:NextNumber(0.8, 1.6) * s), CFrame.lookAt(pos, pos + tangente), def.veine, Enum.Material.Neon))
	end

	-- Cailloux tombés au sol
	for _ = 1, 6 do
		local a = rng:NextNumber(0, math.pi * 2)
		local r = rng:NextNumber(1.8, 2.8) * s
		local t = rng:NextNumber(0.25, 0.55) * s
		local cf = sol * CFrame.new(math.cos(a) * r, t * 0.3, math.sin(a) * r) * CFrame.Angles(rng:NextNumber(0, 6), rng:NextNumber(0, 6), rng:NextNumber(0, 6))
		local p = piece(modele, "Caillou", Vector3.new(t, t * 0.7, t * 1.2), cf, def.couleur2, def.materiau)
		p.Reflectance = def.reflet
		decor(p)
	end

	modele.PrimaryPart = coeur
	return modele, coeur
end

local function effets(coeur: Part, nom: string)
	local def = MINERAIS[nom]
	local s = def.taille
	if nom == "Charbon" then
		emetteur(coeur, {
			Name = "Fumee", Texture = TEX_FUMEE, LightEmission = 0,
			Color = ColorSequence.new(Color3.fromRGB(35, 35, 40)),
			Size = NumberSequence.new(1.5 * s, 3.5 * s), Transparency = NumberSequence.new(0.65, 1),
			Lifetime = NumberRange.new(2.5, 4), Rate = 3, Speed = NumberRange.new(0.4, 0.9),
			SpreadAngle = Vector2.new(35, 35), Acceleration = Vector3.new(0, 0.4, 0),
			Rotation = NumberRange.new(0, 360), RotSpeed = NumberRange.new(-20, 20),
		})
		emetteur(coeur, {
			Name = "Poussiere", Texture = TEX_ETINCELLE, LightEmission = 0,
			Color = ColorSequence.new(Color3.fromRGB(20, 20, 24)),
			Size = NumberSequence.new(0.15, 0), Lifetime = NumberRange.new(1.5, 2.5), Rate = 6,
			Speed = NumberRange.new(0.5, 1), SpreadAngle = Vector2.new(180, 180), Acceleration = Vector3.new(0, -0.6, 0),
		})
		emetteur(coeur, {
			Name = "BraisesCouvantes", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(255, 90, 30), Color3.fromRGB(160, 20, 5)),
			Size = NumberSequence.new({NumberSequenceKeypoint.new(0, 0), NumberSequenceKeypoint.new(0.5, 0.35), NumberSequenceKeypoint.new(1, 0)}),
			Lifetime = NumberRange.new(0.8, 1.5), Rate = 3, Speed = NumberRange.new(0),
			Shape = Enum.ParticleEmitterShape.Sphere, ShapeStyle = Enum.ParticleEmitterShapeStyle.Surface,
		})
	elseif nom == "Bronze" then
		emetteur(coeur, {
			Name = "Braises", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(255, 210, 130), Color3.fromRGB(255, 100, 30)),
			Size = NumberSequence.new(0.2, 0), Lifetime = NumberRange.new(1, 2), Rate = 12,
			Speed = NumberRange.new(1, 2), SpreadAngle = Vector2.new(60, 60), Acceleration = Vector3.new(0, 2, 0),
		})
		emetteur(coeur, {
			Name = "Coulees", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(255, 200, 90), Color3.fromRGB(255, 70, 15)),
			Size = NumberSequence.new(0.18, 0.08), Lifetime = NumberRange.new(0.6, 1),
			Rate = 4, Speed = NumberRange.new(0.2, 0.5), EmissionDirection = Enum.NormalId.Bottom,
			Acceleration = Vector3.new(0, -18, 0),
		})
	elseif nom == "Fer" then
		emetteur(coeur, {
			Name = "Scintillement", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.new(1, 1, 1), Color3.fromRGB(160, 205, 255)),
			Size = NumberSequence.new({NumberSequenceKeypoint.new(0, 0), NumberSequenceKeypoint.new(0.4, 0.5), NumberSequenceKeypoint.new(1, 0)}),
			Lifetime = NumberRange.new(0.6, 1.1), Rate = 7, Speed = NumberRange.new(0, 0.2),
			Shape = Enum.ParticleEmitterShape.Sphere, ShapeStyle = Enum.ParticleEmitterShapeStyle.Volume,
		})
		emetteur(coeur, {
			Name = "PoussiereBleue", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(190, 225, 255), Color3.fromRGB(80, 140, 255)),
			Size = NumberSequence.new(0.12, 0), Lifetime = NumberRange.new(1, 2), Rate = 5,
			Speed = NumberRange.new(0.3, 0.8), SpreadAngle = Vector2.new(60, 60), Acceleration = Vector3.new(0, 0.8, 0),
		})
	elseif nom == "Gold" then
		emetteur(coeur, {
			Name = "Etoiles", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(255, 250, 220), Color3.fromRGB(255, 200, 60)),
			Size = NumberSequence.new({NumberSequenceKeypoint.new(0, 0), NumberSequenceKeypoint.new(0.4, 0.7), NumberSequenceKeypoint.new(1, 0)}),
			Lifetime = NumberRange.new(0.6, 1.2), Rate = 14, Speed = NumberRange.new(0, 0.3),
			Shape = Enum.ParticleEmitterShape.Sphere, ShapeStyle = Enum.ParticleEmitterShapeStyle.Volume,
		})
		emetteur(coeur, {
			Name = "PoussiereOr", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(255, 240, 160), Color3.fromRGB(255, 170, 30)),
			Size = NumberSequence.new(0.16, 0), Lifetime = NumberRange.new(1.2, 2.2), Rate = 16,
			Speed = NumberRange.new(0.5, 1.2), SpreadAngle = Vector2.new(70, 70), Acceleration = Vector3.new(0, 1, 0),
		})
		emetteur(coeur, {
			Name = "Halo", Texture = TEX_ETINCELLE,
			Color = ColorSequence.new(Color3.fromRGB(255, 200, 60)),
			Size = NumberSequence.new(6 * s),
			Transparency = NumberSequence.new({NumberSequenceKeypoint.new(0, 1), NumberSequenceKeypoint.new(0.5, 0.85), NumberSequenceKeypoint.new(1, 1)}),
			Lifetime = NumberRange.new(1.2), Rate = 2, Speed = NumberRange.new(0), LockedToPart = true,
		})
	end
	if def.lumiere then
		local l = Instance.new("PointLight")
		l.Color = def.lumiere
		l.Brightness = (nom == "Gold") and 3 or 1.6
		l.Range = (nom == "Gold") and 16 or 12
		l.Parent = coeur
	end
end

-- Étiquette au-dessus du minerai : nom + rareté
local function etiquette(coeur: Part, nom: string)
	local def = MINERAIS[nom]
	local b = Instance.new("BillboardGui")
	b.Name = "Etiquette"
	b.Size = UDim2.fromOffset(170, 60)
	b.StudsOffsetWorldSpace = Vector3.new(0, 2.8 * def.taille, 0)
	b.MaxDistance = 50
	b.LightInfluence = 0
	b.Parent = coeur

	local cadre = Instance.new("Frame")
	cadre.Size = UDim2.new(1, 0, 0, 34)
	cadre.BackgroundColor3 = Color3.fromRGB(16, 18, 26)
	cadre.BackgroundTransparency = 0.15
	cadre.Parent = b
	local coin = Instance.new("UICorner")
	coin.CornerRadius = UDim.new(0, 10)
	coin.Parent = cadre
	local bord = Instance.new("UIStroke")
	bord.Color = def.couleurRarete
	bord.Thickness = 2.5
	bord.Parent = cadre

	local titre = Instance.new("TextLabel")
	titre.Size = UDim2.fromScale(1, 1)
	titre.BackgroundTransparency = 1
	titre.Font = Enum.Font.GothamBlack
	titre.TextSize = 22
	titre.TextColor3 = Color3.new(1, 1, 1)
	titre.Text = nom
	titre.Parent = cadre

	local rarete = Instance.new("TextLabel")
	rarete.Position = UDim2.fromOffset(0, 36)
	rarete.Size = UDim2.new(1, 0, 0, 22)
	rarete.BackgroundTransparency = 1
	rarete.Font = Enum.Font.GothamBold
	rarete.TextSize = 17
	rarete.TextColor3 = def.couleurRarete
	rarete.TextStrokeTransparency = 0.4
	rarete.Text = def.rarete
	rarete.Parent = b
end

local function tirerType(): string
	local total = 0
	for _, nom in ORDRE do
		total += MINERAIS[nom].chance
	end
	local r = math.random() * total
	for _, nom in ORDRE do
		r -= MINERAIS[nom].chance
		if r <= 0 then
			return nom
		end
	end
	return "Charbon"
end

local surCasse = {}

-- Une fissure lumineuse apparaît sur le minerai à chaque coup reçu
local function fissure(modele: Model, coeur: Part, def)
	local dir = Vector3.new(math.random() * 2 - 1, math.random() * 2 - 1, math.random() * 2 - 1).Unit
	local pos = coeur.Position + dir * coeur.Size.Y * 0.56
	local tangente = dir:Cross(Vector3.new(math.random() * 2 - 1, math.random() * 2 - 1, math.random() * 2 - 1)).Unit
	local longueur = (0.6 + math.random() * 0.8) * def.taille
	local f = piece(modele, "Fissure", Vector3.new(0.08, 0.08, longueur), CFrame.lookAt(pos, pos + tangente), def.veine, Enum.Material.Neon)
	f.CanQuery = false
	f.CanCollide = false
	f.Transparency = 1
	TweenService:Create(f, TweenInfo.new(0.15), {Transparency = 0}):Play()
end

local function apparaitre(sol: CFrame, typeFixe: string?)
	local nom = (typeFixe and MINERAIS[typeFixe]) and typeFixe or tirerType()
	local def = MINERAIS[nom]
	local modele, coeur = construire(nom, sol)
	coeur:SetAttribute("Type", nom)
	coeur:SetAttribute("Taille", def.taille)
	coeur:SetAttribute("PV", def.pv)
	coeur:SetAttribute("PVMax", def.pv)
	effets(coeur, nom)
	etiquette(coeur, nom)
	modele.Parent = dossier

	-- Le minerai pousse depuis le sol
	local echelle = Instance.new("NumberValue")
	echelle.Value = 0.2
	modele:ScaleTo(0.2)
	echelle.Changed:Connect(function(v)
		if modele.Parent then
			modele:ScaleTo(v)
		end
	end)
	TweenService:Create(echelle, TweenInfo.new(0.7, Enum.EasingStyle.Back, Enum.EasingDirection.Out), {Value = 1}):Play()
	Debris:AddItem(echelle, 1)

	CollectionService:AddTag(coeur, CONFIG.TAG_MINERAI)

	local pvAvant = def.pv
	coeur:GetAttributeChangedSignal("PV"):Connect(function()
		local pv = coeur:GetAttribute("PV") or 0
		local perdus = math.max(0, pvAvant - pv)
		pvAvant = pv
		if pv > 0 then
			for _ = 1, perdus * 2 do
				fissure(modele, coeur, def)
			end
		end
	end)

	surCasse[coeur] = function()
		-- La pioche a cassé le cœur : le reste du rocher disparaît, puis un minerai repousse
		local b = coeur:FindFirstChild("Etiquette")
		if b then b.Enabled = false end
		for _, d in modele:GetDescendants() do
			if d:IsA("ParticleEmitter") then
				d.Enabled = false
			elseif d:IsA("PointLight") then
				TweenService:Create(d, TweenInfo.new(0.4), {Brightness = 0}):Play()
			elseif d:IsA("BasePart") and d ~= coeur then
				d.CanCollide = false
				TweenService:Create(d, TweenInfo.new(0.35), {Transparency = 1, Size = d.Size * 0.5}):Play()
			end
		end
		Debris:AddItem(modele, 1.5)
		task.delay(CONFIG.REAPPARITION, function()
			apparaitre(sol, typeFixe)
		end)
	end
end

CollectionService:GetInstanceRemovedSignal(CONFIG.TAG_MINERAI):Connect(function(instance)
	local f = surCasse[instance]
	if f then
		surCasse[instance] = nil
		f()
	end
end)

-- ===== Récompenses =====
local function surJoueur(joueur: Player)
	local stats = joueur:FindFirstChild("leaderstats")
	if not stats then
		stats = Instance.new("Folder")
		stats.Name = "leaderstats"
		stats.Parent = joueur
	end
	if not stats:FindFirstChild(CONFIG.MONNAIE) then
		local v = Instance.new("IntValue")
		v.Name = CONFIG.MONNAIE
		v.Parent = stats
	end
end
Players.PlayerAdded:Connect(surJoueur)
for _, joueur in Players:GetPlayers() do
	surJoueur(joueur)
end

task.spawn(function()
	local evenement = ServerStorage:WaitForChild("MineraiCasse", 60)
	if not evenement then
		warn("Minerais : script de la Pioche de Braise introuvable, pas de récompense.")
		return
	end
	evenement.Event:Connect(function(joueur, bloc)
		local nom = bloc and bloc:GetAttribute("Type")
		local def = nom and MINERAIS[nom]
		if not joueur or not def then return end
		local stats = joueur:FindFirstChild("leaderstats")
		local v = stats and stats:FindFirstChild(CONFIG.MONNAIE)
		if v then
			v.Value += def.valeur
		end
	end)
end)

-- ===== Apparition =====
local points = CollectionService:GetTagged(CONFIG.TAG_SPAWN)
if #points == 0 then
	for i, nom in ORDRE do
		local x = (i - 2.5) * CONFIG.DEMO_ECART
		apparaitre(CFrame.new(CONFIG.DEMO_POSITION + Vector3.new(x, 0, 0)), nom)
	end
else
	for _, p in points do
		if p:IsA("BasePart") then
			p.Transparency = 1
			p.CanCollide = false
			p.CanQuery = false
			apparaitre(CFrame.new(p.Position - Vector3.new(0, p.Size.Y / 2, 0)), p:GetAttribute("Type"))
		end
	end
end
</script>

<script type="text/plain" id="luau-minerais-client">
-- Minerais · SCRIPT CLIENT
-- Où : StarterPlayer > StarterPlayerScripts > LocalScript
-- Effets fluides autour de chaque minerai : éclats en orbite, tourbillons lumineux,
-- arcs électriques (Fer), rayons divins + sceau au sol (Gold) et lumière qui respire.
-- Tout est créé uniquement sur ton écran : rien n'est envoyé au serveur.

local CollectionService = game:GetService("CollectionService")
local RunService = game:GetService("RunService")

local TAG = "Minerai"
local DISTANCE_MAX = 160

local STYLE = {
	Charbon = {
		eclats = 6, couleur = Color3.fromRGB(26, 26, 30), materiau = Enum.Material.Slate, rayon = 2.2, vitesse = 0.5, tourbillons = {},
		lueur = Color3.fromRGB(255, 70, 20), lumiere = 0.6,
	},
	Bronze = {
		eclats = 6, couleur = Color3.fromRGB(255, 130, 50), materiau = Enum.Material.Neon, rayon = 2.3, vitesse = 0.9, lumiere = 1.2,
		tourbillons = {
			{couleur = Color3.fromRGB(255, 150, 60), inclinaison = CFrame.Angles(math.rad(65), 0, math.rad(20)), vitesse = 2.4, largeur = 0.22},
		},
	},
	Fer = {
		eclats = 6, couleur = Color3.fromRGB(165, 172, 186), materiau = Enum.Material.Metal, rayon = 2.4, vitesse = 1.1,
		lueur = Color3.fromRGB(150, 200, 255), lumiere = 1.4, arcs = 2,
		tourbillons = {
			{couleur = Color3.fromRGB(160, 205, 255), inclinaison = CFrame.Angles(math.rad(70), 0, math.rad(15)), vitesse = 2.6, largeur = 0.2},
			{couleur = Color3.fromRGB(220, 240, 255), inclinaison = CFrame.Angles(math.rad(110), 0, math.rad(-25)), vitesse = -2.1, largeur = 0.14},
		},
	},
	Gold = {
		eclats = 8, couleur = Color3.fromRGB(255, 205, 60), materiau = Enum.Material.Neon, rayon = 2.6, vitesse = 1.3,
		lumiere = 2, rayons = 8,
		tourbillons = {
			{couleur = Color3.fromRGB(255, 215, 90), inclinaison = CFrame.Angles(math.rad(70), 0, math.rad(20)), vitesse = 2.8, largeur = 0.3},
			{couleur = Color3.fromRGB(255, 240, 170), inclinaison = CFrame.Angles(math.rad(105), 0, math.rad(-30)), vitesse = -2.3, largeur = 0.2},
		},
	},
}

local dossier = Instance.new("Folder")
dossier.Name = "EffetsMinerais"
dossier.Parent = workspace

local actifs = {}

local function partieLocale(taille: Vector3, couleur: Color3, materiau: Enum.Material, cf: CFrame): Part
	local p = Instance.new("Part")
	p.Anchored = true
	p.CanCollide = false
	p.CanQuery = false
	p.CanTouch = false
	p.CastShadow = false
	p.Size = taille
	p.Color = couleur
	p.Material = materiau
	p.CFrame = cf
	p.TopSurface = Enum.SurfaceType.Smooth
	p.BottomSurface = Enum.SurfaceType.Smooth
	p.Parent = dossier
	return p
end

local function ajouter(coeur: Instance)
	if not coeur:IsA("BasePart") or actifs[coeur] then return end
	local style = STYLE[coeur:GetAttribute("Type")]
	if not style then return end
	local taille = coeur:GetAttribute("Taille") or 1

	local e = {style = style, taille = taille, eclats = {}, tourbillons = {}, phase = math.random() * 10, cache = false}
	for i = 1, style.eclats do
		local t = (0.22 + math.random() * 0.22) * taille
		local p = partieLocale(Vector3.new(t, t * 1.3, t), style.couleur, style.materiau, coeur.CFrame)
		table.insert(e.eclats, {
			partie = p,
			angle = (i / style.eclats) * math.pi * 2,
			hauteur = math.random() * 1.8 - 0.7,
			vitesse = 0.7 + math.random() * 0.6,
			spin = Vector3.new(math.random() * 4 - 2, math.random() * 4 - 2, math.random() * 4 - 2),
		})
	end
	for _, def in style.tourbillons do
		local porteur = partieLocale(Vector3.new(0.1, 0.1, 0.1), def.couleur, Enum.Material.Neon, coeur.CFrame)
		porteur.Transparency = 1
		local a0 = Instance.new("Attachment")
		a0.Position = Vector3.new(0, def.largeur / 2, 0)
		a0.Parent = porteur
		local a1 = Instance.new("Attachment")
		a1.Position = Vector3.new(0, -def.largeur / 2, 0)
		a1.Parent = porteur
		local trainee = Instance.new("Trail")
		trainee.Attachment0 = a0
		trainee.Attachment1 = a1
		trainee.Lifetime = 0.8
		trainee.LightEmission = 1
		trainee.LightInfluence = 0
		trainee.Color = ColorSequence.new(def.couleur)
		trainee.Transparency = NumberSequence.new(0, 1)
		trainee.WidthScale = NumberSequence.new(1, 0.1)
		trainee.FaceCamera = true
		trainee.Parent = porteur
		table.insert(e.tourbillons, {partie = porteur, trainee = trainee, def = def})
	end

	-- Extras : arcs électriques (Fer), rayons + sceau au sol (Gold), lumière qui respire
	e.extras, e.faisceaux = {}, {}
	local support = partieLocale(Vector3.new(0.1, 0.1, 0.1), style.couleur, Enum.Material.SmoothPlastic, coeur.CFrame)
	support.Transparency = 1
	table.insert(e.extras, support)
	e.support = support

	local lumiere = Instance.new("PointLight")
	lumiere.Color = style.lueur or style.couleur
	lumiere.Range = 12 * taille
	lumiere.Brightness = 0
	lumiere.Shadows = false
	lumiere.Parent = support
	e.lumiere = lumiere

	local function faisceau(couleur: Color3, largeur0: number, largeur1: number, transparence: NumberSequence): (Beam, Attachment, Attachment)
		local a0 = Instance.new("Attachment")
		a0.Parent = support
		local a1 = Instance.new("Attachment")
		a1.Parent = support
		local b = Instance.new("Beam")
		b.Attachment0 = a0
		b.Attachment1 = a1
		b.Color = ColorSequence.new(couleur)
		b.LightEmission = 1
		b.LightInfluence = 0
		b.Width0 = largeur0
		b.Width1 = largeur1
		b.Transparency = transparence
		b.FaceCamera = true
		b.Segments = 12
		b.Parent = support
		table.insert(e.faisceaux, b)
		return b, a0, a1
	end

	if style.arcs then
		e.arcs = {}
		for _ = 1, style.arcs do
			local b, a0, a1 = faisceau(Color3.fromRGB(190, 225, 255), 0.12, 0.04, NumberSequence.new(0))
			table.insert(e.arcs, {beam = b, a0 = a0, a1 = a1, prochain = 0})
		end
	end

	if style.rayons then
		e.rayons = {}
		local centreA = Instance.new("Attachment")
		centreA.Parent = support
		for i = 1, style.rayons do
			local b, _, a1 = faisceau(Color3.fromRGB(255, 225, 130), 0.8 * taille, 0, NumberSequence.new(0.55, 1))
			b.Attachment0 = centreA
			table.insert(e.rayons, {beam = b, bout = a1, angle = (i / style.rayons) * math.pi * 2, longueur = (2.6 + math.random() * 1.6) * taille})
		end

		-- Sceau hexagonal au sol
		local sceau = Instance.new("Model")
		sceau.Name = "Sceau"
		local disque = partieLocale(Vector3.new(0.05, 4.6 * taille, 4.6 * taille), Color3.fromRGB(255, 200, 60), Enum.Material.Neon, coeur.CFrame)
		disque.Shape = Enum.PartType.Cylinder
		disque.Transparency = 0.82
		disque.Parent = sceau
		local barres = {}
		for i = 1, 6 do
			local b = partieLocale(Vector3.new(3.2 * taille * 0.66, 0.06, 0.08), Color3.fromRGB(255, 220, 110), Enum.Material.Neon, coeur.CFrame)
			b.Transparency = 0.35
			b.Parent = sceau
			barres[i] = b
		end
		sceau.Parent = dossier
		table.insert(e.extras, sceau)
		e.sceau = {disque = disque, barres = barres}
	end

	actifs[coeur] = e
end

local function retirer(coeur: Instance)
	local e = actifs[coeur]
	if not e then return end
	for _, f in e.eclats do f.partie:Destroy() end
	for _, w in e.tourbillons do w.partie:Destroy() end
	for _, x in e.extras do x:Destroy() end
	actifs[coeur] = nil
end

-- Point au hasard sur une coquille autour du minerai
local function surCoquille(centre: Vector3, rMin: number, rMax: number): Vector3
	local d = Vector3.new(math.random() * 2 - 1, math.random() * 1.6 - 0.5, math.random() * 2 - 1)
	if d.Magnitude < 0.01 then d = Vector3.yAxis end
	return centre + d.Unit * (rMin + math.random() * (rMax - rMin))
end

CollectionService:GetInstanceAddedSignal(TAG):Connect(ajouter)
CollectionService:GetInstanceRemovedSignal(TAG):Connect(retirer)
for _, coeur in CollectionService:GetTagged(TAG) do
	ajouter(coeur)
end

RunService.RenderStepped:Connect(function()
	local t = os.clock()
	local camera = workspace.CurrentCamera.CFrame.Position
	for coeur, e in actifs do
		if not coeur.Parent then
			retirer(coeur)
			continue
		end
		local centre = coeur.Position
		local cache = (centre - camera).Magnitude > DISTANCE_MAX or coeur.Transparency >= 1
		if cache ~= e.cache then
			e.cache = cache
			for _, f in e.eclats do f.partie.Transparency = cache and 1 or 0 end
			for _, w in e.tourbillons do w.trainee.Enabled = not cache end
			for _, b in e.faisceaux do b.Enabled = not cache end
			e.lumiere.Enabled = not cache
			if e.sceau then
				e.sceau.disque.Transparency = cache and 1 or 0.82
				for _, b in e.sceau.barres do b.Transparency = cache and 1 or 0.35 end
			end
		end
		if not cache then
			local echelle = coeur.Size.Y / 2 -- suit l'animation de pousse
			local st = e.style
			e.support.CFrame = CFrame.new(centre)
			e.lumiere.Brightness = (st.lumiere or 0) * (0.75 + 0.25 * math.sin(t * 2.2 + e.phase))

			-- Fer : arcs électriques qui sautent d'un point à l'autre
			if e.arcs then
				for _, arc in e.arcs do
					if t >= arc.prochain then
						arc.prochain = t + 0.06 + math.random() * 0.08
						arc.a0.WorldPosition = surCoquille(centre, 1.0 * echelle, 1.3 * echelle)
						arc.a1.WorldPosition = surCoquille(centre, 1.6 * echelle, 2.4 * echelle)
						arc.beam.CurveSize0 = math.random() * 4 - 2
						arc.beam.CurveSize1 = math.random() * 4 - 2
						arc.beam.Enabled = math.random() < 0.7
					end
				end
			end

			-- Gold : rayons divins face caméra + sceau qui tourne au sol
			if e.rayons then
				local cam = workspace.CurrentCamera.CFrame
				for i, r in e.rayons do
					local a = r.angle + t * 0.35
					local pulse = 0.8 + 0.2 * math.sin(t * 3 + i)
					local dir = cam.RightVector * math.cos(a) + cam.UpVector * math.sin(a)
					r.bout.WorldPosition = centre + dir * r.longueur * pulse * echelle / math.max(e.taille, 0.01)
				end
				local sol = CFrame.new(centre - Vector3.new(0, 1.25 * echelle, 0)) * CFrame.Angles(0, t * 0.6, 0)
				e.sceau.disque.CFrame = sol * CFrame.Angles(0, 0, math.pi / 2)
				local apotheme = 2.1 * echelle * 0.866
				for i, b in e.sceau.barres do
					local a = (i / 6) * math.pi * 2
					b.Size = Vector3.new(2.1 * echelle, 0.06, 0.08)
					b.CFrame = sol * CFrame.Angles(0, a, 0) * CFrame.new(0, 0, apotheme)
				end
			end
			for _, f in e.eclats do
				local a = f.angle + t * 0.5 * st.vitesse * f.vitesse
				local r = st.rayon * echelle
				local pos = centre + Vector3.new(math.cos(a) * r, (f.hauteur + math.sin(t * 1.5 + f.angle) * 0.25) * echelle, math.sin(a) * r)
				f.partie.CFrame = CFrame.new(pos) * CFrame.Angles(t * f.spin.X, t * f.spin.Y, t * f.spin.Z)
			end
			for _, w in e.tourbillons do
				local a = t * w.def.vitesse + e.phase
				w.partie.CFrame = CFrame.new(centre) * w.def.inclinaison * CFrame.Angles(0, a, 0) * CFrame.new(st.rayon * echelle * 0.8, 0, 0)
			end
		end
	end
end)
</script>

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

const worldPos = (cr, p) => { const pv = cr.groups[p.g].pivot; return [pv[0] + p.pos[0], pv[1] + p.pos[1], pv[2] + p.pos[2]]; };
const GROUP_LABEL = { corps: 'Corps', tete: 'Tete', queue: 'Queue', aile: 'AileG', aileD: 'AileD', outil: 'Outil' };

function bounds(cr) {
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  cr.parts.forEach(p => { const w = worldPos(cr, p); for (let i = 0; i < 3; i++) { mn[i] = Math.min(mn[i], w[i] - p.size[i] / 2); mx[i] = Math.max(mx[i], w[i] + p.size[i] / 2); } });
  return { mn, mx, size: mx.map((v, i) => v - mn[i]), center: mx.map((v, i) => (v + mn[i]) / 2) };
}

function luau(cr) {
  const L = [];
  L.push(`-- ${cr.name} · ${cr.kind} (${cr.element}, ${cr.rarity})`);
  L.push(`-- Généré par l'Atelier Bestiaire · ${cr.parts.length} pièces`);
  L.push(`-- À placer dans un Script de ServerScriptService.`, '');
  L.push(`local POSITION = Vector3.new(0, 0, 0) -- où faire apparaître le pet`, '');
  L.push('local PARTS = {');
  cr.parts.forEach(p => {
    const w = worldPos(cr, p);
    let cf = `CFrame.new(${w.map(f).join(', ')})`;
    if (p.rot.some(v => v)) cf += ` * CFrame.Angles(${p.rot.map(v => v ? `math.rad(${v})` : '0').join(', ')})`;
    const [r, g, b] = hexRGB(p.c);
    L.push(`\t{"${GROUP_LABEL[p.g]}_${p.n}", Vector3.new(${p.size.map(f).join(', ')}), ${cf}, Color3.fromRGB(${r}, ${g}, ${b}), ${p.glow}},`);
  });
  L.push('}', '');
  L.push(`local model = Instance.new("Model")`);
  L.push(`model.Name = "${cr.name}"`, '');
  L.push('local root');
  L.push('for i, d in ipairs(PARTS) do');
  L.push('\tlocal p = Instance.new("Part")');
  L.push('\tp.Name = d[1]');
  L.push('\tp.Size = d[2]');
  L.push('\tp.CFrame = CFrame.new(POSITION) * d[3]');
  L.push('\tp.Color = d[4]');
  L.push('\tp.Material = d[5] and Enum.Material.Neon or Enum.Material.SmoothPlastic');
  L.push('\tp.TopSurface = Enum.SurfaceType.Smooth');
  L.push('\tp.BottomSurface = Enum.SurfaceType.Smooth');
  L.push('\tp.CanCollide = false');
  L.push('\tp.Anchored = (i == 1)');
  L.push('\tp.Parent = model');
  L.push('\tif i == 1 then');
  L.push('\t\troot = p');
  L.push('\t\tmodel.PrimaryPart = p');
  L.push('\telse');
  L.push('\t\tlocal weld = Instance.new("WeldConstraint")');
  L.push('\t\tweld.Part0 = root');
  L.push('\t\tweld.Part1 = p');
  L.push('\t\tweld.Parent = p');
  L.push('\tend');
  L.push('end', '');
  L.push('model.Parent = workspace');
  return L.join('\n');
}

const transients = [], timers = [];
const addTransient = (dur, upd, done) => transients.push({ t: 0, dur, upd, done });

}

const NOISE = (() => {

  g.deleteAttribute('normal'); g.deleteAttribute('uv');

  const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const o = [rand() * 60, rand() * 60, rand() * 60];
  const cuts = [];
  for (let i = 0, n = 4 + Math.floor(rand() * 3); i < n; i++) {
    cuts.push([new THREE.Vector3(rand() * 2 - 1, rand() * 1.5 - 0.4, rand() * 2 - 1).normalize(), 0.6 + rand() * 0.25]);

  $('cRarity').style.borderColor = cr.rcol || '';

  $('tabs').hidden = !cr.scripts;
  $('tabs').innerHTML = (cr.scripts || []).map((sc, i) => `<button class="tab" role="tab" data-i="${i}">${sc.label}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tabIndex = +b.dataset.i; renderCode(); }));
  renderCode();

  $('steps').innerHTML = cr.steps ? cr.steps : cr.scripts
    ? `<li>Onglet <b>Serveur</b> : colle-le dans un <b>Script</b> de <b>ServerScriptService</b>.</li>
       <li>Onglet <b>Client</b> : colle-le dans un <b>LocalScript</b> de <b>StarterPlayer › StarterPlayerScripts</b>.</li>
       <li>Ajoute le tag <b>Minerai</b> à tes blocs minables (attribut <b>PV</b> en option), puis lance le jeu.</li>
       <li>Mets <b>PVP = true</b> dans CONFIG si la pioche doit aussi brûler les joueurs.</li>`
    : `<li>Dans Roblox Studio, ouvre <b>ServerScriptService</b> et ajoute un <b>Script</b>.</li>
       <li>Colle le code, puis lance le jeu : le pet apparaît au centre de la map.</li>
       <li>Les pièces sont nommées par groupe (Tete, Queue, Aile…) pour les animer plus tard.</li>`;
  buildCreature(cr);
}

function toggle(btnId, fn) {
  const b = $(btnId);
  b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); });
}
toggle('tAuto', on => { T.auto = on; T.autoT = 0.4; });
toggle('tAura', on => { T.auraOn = on; });
toggle('tRotate', on => controls.autoRotate = on);
toggle('tAnim', on => state.anim = on);
toggle('tFx', on => { state.fx = on; if (fx) fx.points.visible = on; });

$('strikeBtn').addEventListener('click', swing);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && T.active && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLPreElement)) { e.preventDefault(); swing(); }
});

$('copyBtn').addEventListener('click', () => {
  const btn = $('copyBtn'), text = $('code').textContent;
  const done = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = 'Copier', 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Sélectionné, fais Ctrl+C'); };
  try { navigator.clipboard.writeText(text).then(() => done('Copié'), fallback); } catch (e) { fallback(); }
});

if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  controls.autoRotate = false; $('tRotate').setAttribute('aria-pressed', 'false');
  T.auto = false; $('tAuto').setAttribute('aria-pressed', 'false');
}
select('minerais');
</script>
